<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking payment · Búzios Lanchas</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/login/icon-192.png">
<style>
/* página de pagamento da reserva (Rodrigo, 2026-10-22): começa com o PayPal para clientes estrangeiros; outras formas de pagamento entram aqui depois */
:root{--sea-deep:#06394a;--sea:#0b6e86;--ink:#10262e;--muted:#5b6f76;--bg:#f3f6f7;--surface:#fff;--line:#dfe7ea;--brass:#c9992f;--ok:#1d7a3a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--ink:#e8f0f2;--muted:#9fb3ba;--bg:#0c1a1f;--surface:#12252c;--line:#24404a;--sea:#5cc0d8;--ok:#5fd08a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--sea-deep);color:#fff;padding:14px 16px}
header .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:18px}
.langs{display:flex;gap:6px}
.langs button{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:999px;padding:5px 11px;font-weight:700;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#1d1503}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:22px;line-height:1.25;margin:0 0 12px}
.rows{display:grid;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.rows li span:first-child{color:var(--muted)}
.rows li b{text-align:right}
.amt{font-size:30px;font-weight:800;margin:4px 0 2px}
.muted{color:var(--muted);font-size:14px}
#pp{min-height:60px}.meth{font-size:16px;margin:18px 0 10px}
.msg{padding:14px;border-radius:14px;margin-top:14px;font-weight:600}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
a.btn{display:inline-block;margin-top:14px;background:var(--sea-deep);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 16px}
</style>
</head>
<body>
<header><div class="in"><a href="/">Búzios Lanchas</a><div class="langs" role="group" aria-label="Language">
  <button type="button" data-lg="en">EN</button><button type="button" data-lg="es">ES</button><button type="button" data-lg="pt">PT</button></div></div></header>
<main><div class="card" id="box"><p class="muted" id="wait">…</p></div></main>
<script>
const FN="https://sqoperylsqcbcjpcrlnp.supabase.co/functions/v1/paypal-checkout";
const KEY="sb_publishable_Dvz6L37Nn7kTKyPmh0_CHw_5CJnQIuJ";
const T={
  en:{title:"Booking payment", meth:"Pay with PayPal or credit card", boat:"Boat", date:"Date", time:"Time", people:"People", dep:"Deposit to confirm your booking", how:"Pay securely with PayPal or a credit card. The balance is paid at boarding, directly to the boat's crew.", paid:"Payment received! Búzios Lanchas will confirm your booking shortly.", already:"This deposit is already paid. Thank you!", closed:"This booking is no longer waiting for payment. Please talk to us on WhatsApp.", bad:"This payment link is not valid. Please talk to us on WhatsApp.", fail:"The payment did not go through. Please try again or talk to us on WhatsApp.", keys:"Online payment is not available right now. Please talk to us on WhatsApp.", wa:"Talk to us on WhatsApp", my:"See my trips", loc:"en-US",
    slot:{manha:"10 am to 2 pm",tarde:"2 pm to 6 pm",dia:"10 am to 5 pm",noite:"night"}, hi:n=>`Hi${n?" "+n:""}!`},
  es:{title:"Pago de la reserva", meth:"Paga con PayPal o tarjeta de crédito", boat:"Lancha", date:"Fecha", time:"Horario", people:"Personas", dep:"Seña para confirmar tu reserva", how:"Paga de forma segura con PayPal o tarjeta de crédito. El resto se paga al embarcar, directamente al responsable de la lancha.", paid:"¡Pago recibido! Búzios Lanchas confirmará tu reserva en breve.", already:"Esta seña ya está pagada. ¡Gracias!", closed:"Esta reserva ya no espera pago. Escríbenos por WhatsApp.", bad:"Este link de pago no es válido. Escríbenos por WhatsApp.", fail:"El pago no se completó. Inténtalo de nuevo o escríbenos por WhatsApp.", keys:"El pago en línea no está disponible ahora. Escríbenos por WhatsApp.", wa:"Escríbenos por WhatsApp", my:"Ver mis paseos", loc:"es",
    slot:{manha:"10 a 14 h",tarde:"14 a 18 h",dia:"10 a 17 h",noite:"noche"}, hi:n=>`¡Hola${n?" "+n:""}!`},
  pt:{title:"Pagamento da reserva", meth:"Pague com PayPal ou cartão de crédito", boat:"Lancha", date:"Data", time:"Horário", people:"Pessoas", dep:"Sinal para confirmar a sua reserva", how:"Pague com segurança pelo PayPal ou cartão de crédito. O restante é pago na hora do embarque, direto ao responsável pela lancha.", paid:"Pagamento recebido! A Búzios Lanchas vai confirmar a sua reserva em instantes.", already:"Este sinal já está pago. Obrigado!", closed:"Esta reserva não está mais aguardando pagamento. Fale com a gente no WhatsApp.", bad:"Este link de pagamento não é válido. Fale com a gente no WhatsApp.", fail:"O pagamento não foi concluído. Tente de novo ou fale com a gente no WhatsApp.", keys:"O pagamento on-line não está disponível agora. Fale com a gente no WhatsApp.", wa:"Fale com a gente no WhatsApp", my:"Ver meus passeios", loc:"pt-BR",
    slot:{manha:"10h às 14h",tarde:"14h às 18h",dia:"10h às 17h",noite:"noite"}, hi:n=>`Olá${n?", "+n:""}!`}
};
const q=new URLSearchParams(location.search), P=q.get("p"), K=q.get("k");
let lg=(()=>{ try{ const s=localStorage.getItem("pagar-lang"); if(T[s]) return s; }catch(e){} const n=(navigator.language||"en").slice(0,2); return T[q.get("l")]?q.get("l"):T[n]?n:"en"; })();
let D=null, state="wait", sdk=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const box=document.getElementById("box");
const waBtn=()=>`<a class="btn" href="https://wa.me/5521999272550" target="_blank" rel="noopener">${T[lg].wa}</a>`;
function render(){
  const L=T[lg]; document.documentElement.lang=lg; document.title=L.title+" · Búzios Lanchas";
  document.querySelectorAll("[data-lg]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lg===lg));
  if(state==="wait"){ box.innerHTML=`<p class="muted">…</p>`; return; }
  if(state==="bad"){ box.innerHTML=`<p class="msg err">${L.bad}</p>${waBtn()}`; return; }
  const d=new Date(D.data+"T12:00:00").toLocaleDateString(L.loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  let tail="";
  if(state==="paid") tail=`<p class="msg ok">✓ ${L.paid}</p><a class="btn" href="/login/">${L.my}</a>`;
  else if(D.pago_em) tail=`<p class="msg ok">✓ ${L.already}</p><a class="btn" href="/login/">${L.my}</a>`;
  else if(D.status!=="pendente") tail=`<p class="msg err">${L.closed}</p>${waBtn()}`;
  else if(!D.cliente_id) tail=`<p class="msg err">${L.keys}</p>${waBtn()}`;
  else tail=`<p class="muted">${L.how}</p><h2 class="meth">${L.meth}</h2><div class="pay" data-m="paypal"><div id="pp"></div></div><div id="ppmsg"></div>`; /* cada forma de pagamento é um .pay */
  box.innerHTML=`<p class="muted" style="margin:0">${esc(L.hi(D.nome))}</p><h1>${L.title}</h1>
    <ul class="rows"><li><span>${L.boat}</span><b>${esc(D.lancha)}</b></li><li><span>${L.date}</span><b>${esc(d)}</b></li>
    <li><span>${L.time}</span><b>${esc(L.slot[D.horario]||"")}</b></li><li><span>${L.people}</span><b>${esc(D.pessoas)}</b></li></ul>
    <div class="muted">${L.dep}</div><div class="amt">${esc(D.texto)}</div>${tail}`;
  if(document.getElementById("pp")) mountPP();
}
const post=b=>fetch(FN,{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({p:P,k:K,...b})}).then(r=>r.json().catch(()=>({})));
function loadSdk(){
  if(sdk) return sdk;
  sdk=new Promise((ok,no)=>{ const s=document.createElement("script");
    s.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(D.cliente_id)}&currency=${encodeURIComponent(D.moeda)}&intent=capture&components=buttons&enable-funding=card`;
    s.onload=ok; s.onerror=no; document.head.appendChild(s); });
  return sdk;
}
async function mountPP(){
  const el=document.getElementById("pp"), msg=document.getElementById("ppmsg");
  try{ await loadSdk(); }catch(e){ msg.innerHTML=`<p class="msg err">${T[lg].keys}</p>${waBtn()}`; return; }
  if(!document.body.contains(el)) return;
  paypal.Buttons({
    style:{layout:"vertical",shape:"pill",label:"pay"},
    createOrder: async()=>{ const j=await post({acao:"criar"}); if(j.pago){ state="paid"; render(); throw new Error("pago"); } if(!j.id) throw new Error(j.erro||"criar"); return j.id; },
    onApprove: async data=>{ msg.innerHTML=`<p class="muted">…</p>`; const j=await post({acao:"capturar", order:data.orderID});
      if(j.pago){ state="paid"; D.pago_em=new Date().toISOString(); render(); } else msg.innerHTML=`<p class="msg err">${T[lg].fail}</p>${waBtn()}`; },
    onError: ()=>{ if(state!=="paid") msg.innerHTML=`<p class="msg err">${T[lg].fail}</p>${waBtn()}`; }
  }).render(el).catch(()=>{});
}
document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{ lg=b.dataset.lg; try{ localStorage.setItem("pagar-lang",lg); }catch(e){} render(); });
render();
(async()=>{ try{ if(!P||!K) throw 0; const r=await fetch(`${FN}?p=${encodeURIComponent(P)}&k=${encodeURIComponent(K)}`,{headers:{apikey:KEY}}); if(!r.ok) throw 0; D=await r.json(); state="show"; }catch(e){ state="bad"; } render(); })();
</script>
</body>
</html>
