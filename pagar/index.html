:root{--sea-deep:#06394a;--sea:#0b6e86;--ink:#10262e;--muted:#5b6f76;--bg:#f3f6f7;--surface:#fff;--line:#dfe7ea;--brass:#c9992f;--ok:#1d7a3a;--bad:#b3261e;--chip:#e9f1f3}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--sea-deep);color:#fff;padding:14px 16px}
header .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:18px}
.langs{display:flex;gap:6px}
.langs button{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:999px;padding:5px 11px;font-weight:700;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#1d1503}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h1{font-size:22px;line-height:1.25;margin:0 0 12px}
h2{font-size:16px;margin:0 0 10px}
.rows{display:grid;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.rows li span:first-child{color:var(--muted)}
.rows li b{text-align:right}
.amt{font-size:30px;font-weight:800;margin:4px 0 2px}
.muted{color:var(--muted);font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.steps li i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:var(--chip);color:var(--muted)}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok);color:#fff}

.pay{border:1px solid var(--line);border-radius:14px;padding:14px}.pay+.pay{margin-top:12px}.card>.msg:first-child{margin-top:0}
.pay h3{margin:0 0 6px;font-size:16px}

.key{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
.key strong{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;background:var(--sea-deep);color:#fff;text-decoration:none;font:inherit;font-weight:700;border-radius:12px;padding:12px 16px;width:100%;margin-top:8px}
.btn.sec{background:var(--chip);color:var(--ink)}
.key .btn{width:auto;margin:0}
.msg{padding:14px;border-radius:14px;margin-top:14px;font-weight:600}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
#pp{min-height:60px;margin-top:8px}
.qr{max-width:240px;margin:12px auto 0;background:#fff;padding:8px;border-radius:12px}.qr svg{display:block;width:100%;height:auto}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f2a33;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

.fab{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;color:#fff;background:var(--sea-deep);padding:11px 16px 11px 13px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.28)}

.chwin .chx{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer;z-index:1}.chwin .chx[hidden]{display:none}

  const d=new Date(D.data+"T12:00:00").toLocaleDateString(L.loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const paid=!!(D.pago_em||D.comprovante_em), conf=!!D.confirmada, open=D.status==="pendente";
  /* a lancha foi para outro cliente (pagou antes ou já foi confirmada): não deixa pagar e leva para as lanchas livres no dia (Rodrigo 2026-10-22) */
  const gone=!!D.indisponivel && !paid && !conf && state!=="paid", livres=`${lg==="pt"?"":"/"+lg}/?data=${D.data}#frota`;
  const step=conf?3:paid?2:1, cls=n=>n<step||(n===3&&conf)?"done":n===step?"now":"";
  const s2d = D.pago_em ? tf(L.s2pp,{v:esc(D.pago_valor||D.texto)}) + " " + L.s2d : D.comprovante_em ? L.s2px+" "+L.s2d : L.s2d;
  const steps=`<div class="card"><h2>${L.st}</h2><ol class="steps">
    <li class="${cls(1)}"><i>${step>1?"✓":"1"}</i><span>${L.s1}${step===1?`<small>${L.s1d}</small>`:""}</span></li>
    <li class="${cls(2)}"><i>${step>2?"✓":"2"}</i><span>${L.s2}${step===2?`<small>${s2d}</small>`:""}</span></li>
    <li class="${cls(3)}"><i>${conf?"✓":"3"}</i><span>${L.s3}${conf?`<small>${L.s3d}</small>`:""}</span></li></ol></div>`;
  const brlV=D.sinal_brl||(D.moeda==="BRL"?D.valor:0), foreign=D.moeda!=="BRL";
  const pix = brlV ? `<div class="pay" data-m="pix"><h3>${foreign?L.pixBr:L.pixT}</h3>
    <div class="muted">${L.pixV}: <b>${brl(brlV)}</b></div>
    <div class="qr" aria-label="QR code Pix">${qrSvg(pixPayload(PIX_CNPJ, brlV, "PED"+D.pedido))}</div><p class="muted" style="text-align:center;margin:4px 0 0">${L.qrHow}</p>
    <div class="key"><span><span class="muted">${L.pixKey}</span><br><strong>${PIX_FMT}</strong><br><small class="muted">Búzios Lanchas</small></span><button type="button" class="btn sec" data-copy="${PIX_CNPJ}">${L.copyKey}</button></div>
    <button type="button" class="btn sec" data-copy="${esc(pixPayload(PIX_CNPJ, brlV, "PED"+D.pedido))}">${L.copyCC}</button>
    <p class="muted" style="margin:10px 0 0">${L.pixSend}</p>${D.chat?`<button type="button" class="btn" data-chat="${D.chat}">${L.sendRcpt}</button>`:""}</div>` : "";
  const pp = foreign && D.cliente_id ? `<div class="pay" data-m="paypal"><h3>${L.ppT}</h3><p class="muted" style="margin:0">${L.ppHow}</p><div id="pp"></div><div id="ppmsg"></div></div>` : "";
  let payArea="";
  if(state==="paid") payArea=`<p class="msg ok">✓ ${L.paid}</p>`;
  else if(gone) payArea=`<p class="msg err">${tf(L.gone,{b:esc(D.lancha)})}</p><a class="btn" href="${livres}">${L.goneBtn}</a>`;
  /* com o Asaas na tela, o Pix manual some (dois QR codes diferentes levavam a pagar em dobro); outro cliente pagando: só o aviso (revisão 2026-10-25) */
  else if(open && !paid && D.pagando) payArea=`<p class="msg err">${L.busy}</p>`;
  else if(open && !paid) payArea = pp + ((h=>h + (h.includes('data-m="as-pix"') ? "" : pix))(asHTML())) + (foreign && !D.cliente_id && !D.vendedor ? `<p class="msg err">${L.keys}</p>` : "");
  else if(!open && !conf) payArea=`<p class="msg err">${L.closed}</p>`;
  /* o chat fica só no botão Suporte do canto (Rodrigo 2026-10-25); aqui sobra o WhatsApp (sem chat) e Ver meus passeios */
  const my=conf||paid?`<a class="btn sec" href="/login/">${L.my}</a>`:"";
  const chats=!D.chat?`<div class="card"><h2>${L.chats}</h2>${waBtn()}${my}</div>`:my?`<div class="card">${my}</div>`:"";
  box.innerHTML=`<div class="card"><p class="muted" style="margin:0">${esc(L.hi(D.nome))}</p><h1>${L.title}</h1>
    <ul class="rows"><li><span>${L.boat}</span><b>${esc(D.lancha)}</b></li><li><span>${L.date}</span><b>${esc(d)}</b></li>
    <li><span>${L.time}</span><b>${esc(L.slot[D.horario]||"")}</b></li><li><span>${L.people}</span><b>${esc(D.pessoas)}</b></li></ul>
    <div class="muted">${L.dep}</div><div class="amt">${esc(D.texto)}</div>${foreign&&brlV?`<div class="muted">${brl(brlV)}</div>`:""}${gone?"":`<p class="muted" style="margin:6px 0 0">${D.resto_brl>0 ? L.restV.replace("{v}", brl(D.resto_brl)) : D.resto_brl===0 ? L.rest0 : L.rest /* com o valor do restante, em reais (Rodrigo 2026-10-25) */}</p>`}</div>${gone?"":steps}${payArea?`<div class="card">${payArea}</div>`:""}${chats}`;
  if(document.getElementById("pp")) mountPP();
  fabs();
}
/* botão Suporte: chat com a Búzios Lanchas (e com o vendedor, se houver) e WhatsApp, sem ocupar espaço na página */
const FB=document.getElementById("fabs"), FM=document.getElementById("supm"), FS=document.getElementById("sup");
const WA_SVG=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3Z"/></svg>`;
const SUP_SVG=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h2v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3v1h-6v2h6a2 2 0 0 0 2-2v-9a9 9 0 0 0-9-9z"/></svg>`;
function fabs(){ const L=T[lg]; FB.hidden=!D; if(!D) return;
  const wa=`https://wa.me/5521999272550?text=${encodeURIComponent(tf(L.waPay,{b:D.lancha,d:new Date(D.data+"T12:00:00").toLocaleDateString(L.loc)}))}`;
  FM.innerHTML=(D.chat?`<button type="button" class="fab" data-chat="${D.chat}"><span aria-hidden="true">💬</span>${L.supChat} · Búzios Lanchas</button>`:"")
    +(D.vendedor&&D.chat_vendedor?`<button type="button" class="fab" data-chat="${D.chat_vendedor}"><span aria-hidden="true">💬</span>${L.supChat} · ${esc(D.vendedor)}</button>`:"")
    +`<a class="fab wa" href="${wa}" target="_blank" rel="noopener">${WA_SVG}WhatsApp</a>`;
  FS.innerHTML=SUP_SVG+L.sup; }
FS.onclick=()=>{ FM.hidden=!FM.hidden; FS.setAttribute("aria-expanded",String(!FM.hidden)); };
document.addEventListener("click", e=>{ if(!FM.hidden && !FB.contains(e.target)){ FM.hidden=true; FS.setAttribute("aria-expanded","false"); } });
/* bloco do Asaas: valores já com a taxa de cada forma de pagamento (o cliente paga as taxas, Rodrigo 2026-10-24) */
function asHTML(){
  if(!AS || !A || D.moeda!=="BRL") return "";
  const L=T[lg];
  if(!A.ativo || !A.pix) return `<p class="msg err">${L.asOff}</p>`;
  const fee=v=>tf(L.asFee,{v:brl(Math.round((v-A.sinal)*100)/100)}), px=AX.pix||A.cob_pix;
  const cpf = A.cpf ? "" : `<label class="muted" style="display:block;margin:0 0 6px">${L.asCpf}<input id="as-cpf" inputmode="numeric" autocomplete="off" style="display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px;background:var(--surface);color:var(--ink)"></label>`;
  return `${cpf}<div class="pay" data-m="as-pix"><h3>${L.asPix}</h3><div class="amt" style="font-size:24px">${brl(A.pix)}</div><div class="muted">${fee(A.pix)}</div>
    ${px&&px.pix_payload ? `${px.pix_img?`<img class="qr" style="display:block;width:100%" alt="QR code Pix" src="data:image/png;base64,${esc(px.pix_img)}">`:`<div class="qr">${qrSvg(px.pix_payload)}</div>`}<button type="button" class="btn sec" data-copy="${esc(px.pix_payload)}">${L.copyCC}</button><p class="muted" style="margin:10px 0 0">${L.asAuto}</p>` : `<button type="button" class="btn" data-as="pix">${L.asGen}</button>`}</div>
    ${A.cartao_ok===false?"":`<div class="pay" data-m="as-card"><h3>${L.asCard}</h3>${cardOpts(L)}<button type="button" class="btn" data-as="cartao">💳 ${L.asCardBtn}</button></div>`}
    <p class="muted" style="margin:10px 0 0">⏱ ${L.asHold}</p><div id="asmsg"></div>`;
}
/* cartão em até 6x (Rodrigo 2026-10-25): cada opção mostra a parcela, o total e a taxa; o cliente escolhe */
function cardOpts(L){
  const ps=(A.parcelas&&A.parcelas.length)?A.parcelas:[{n:1,parcela:A.cartao,total:A.cartao}];
  if(!ps.some(o=>o.n===AX.n)) AX.n=1;
  if(ps.length<2) return `<div class="amt" style="font-size:24px">${brl(A.cartao)}</div><div class="muted">${tf(L.asFee,{v:brl(Math.round((A.cartao-A.sinal)*100)/100)})}</div>`;
  return `<p class="muted" style="margin:0 0 8px">${L.asChoose}</p><div class="parc" role="radiogroup">${ps.map(o=>`<label class="po"><input type="radio" name="parc" value="${o.n}"${o.n===AX.n?" checked":""}><span><b>${tf(L.asParc,{n:o.n,p:brl(o.parcela)})}</b><small class="muted">${o.n>1?tf(L.asTot,{t:brl(o.total)})+" · ":""}${tf(L.asTx,{v:brl(Math.round((o.total-A.sinal)*100)/100)})}</small></span></label>`).join("")}</div>`;
}
document.addEventListener("change", e=>{ if(e.target.name==="parc") AX.n=+e.target.value; });
function cpfOk(c){ if(!/^\d{11}$/.test(c)||/^(\d)\1{10}$/.test(c)) return false; const dv=n=>{ let s=0; for(let i=0;i<n;i++) s+=+c[i]*(n+1-i); const r=s*10%11; return r===10?0:r; }; return dv(9)===+c[9]&&dv(10)===+c[10]; }
document.addEventListener("click", async e=>{ const b=e.target.closest("[data-as]"); if(!b) return; const L=T[lg], msg=document.getElementById("asmsg");
  const ci=document.getElementById("as-cpf"), cpf=ci?ci.value.replace(/\D/g,""):"";
  if(ci && !cpfOk(cpf)){ ci.focus(); msg.innerHTML=`<p class="msg err">${L.asCpfBad}</p>`; return; }
  b.disabled=true; msg.innerHTML=`<p class="muted">…</p>`;
  try{ const r=await fetch(FN_AS,{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({acao:"pagar",p:P,k:K,metodo:b.dataset.as,cpf,n:b.dataset.as==="cartao"?(AX.n||1):1})}); const j=await r.json().catch(()=>({}));
    if(j.pago){ state="paid"; render(); return; }
    if(j.erro==="ocupada"){ D.indisponivel=true; render(); return; }
    if(j.erro==="pagando"||j.erro==="passou"){ msg.innerHTML=`<p class="msg err">${j.erro==="passou"?L.late:L.busy}</p>`; b.disabled=false; return; }
    if(j.erro==="cpf"){ const keep=ci?.value||""; A.cpf=false; render(); const nc=document.getElementById("as-cpf"); if(nc) nc.value=keep; document.getElementById("asmsg").innerHTML=`<p class="msg err">${L.asCpfBad}</p>`; return; }
    if(j.erro==="cartao_prazo"){ A.cartao_ok=false; render(); document.getElementById("asmsg").innerHTML=`<p class="msg err">${L.asCardPrazo}</p>`; return; }
    if(j.erro==="repasse"){ msg.innerHTML=`<p class="msg err">${L.asRep}</p>`; b.disabled=false; return; }
    if(!r.ok) throw 0;
    A.cpf=true;
    if(j.metodo==="cartao" && j.url){ location.href=j.url; return; }
    AX.pix=j; render(); asWatch();
  }catch(x){ b.disabled=false; msg.innerHTML=`<p class="msg err">${L.asErr}</p>`; } });
/* depois de gerar o Pix (ou voltar do cartão), confere no Asaas a cada 8 s se já caiu */
let asT=null;
function asWatch(){ if(asT) return; asT=setInterval(async()=>{ if(document.hidden || state==="paid") return;
  try{ const j=await fetch(FN_AS,{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({acao:"conferir",p:P,k:K})}).then(r=>r.json()); if(j.pago){ state="paid"; D.pago_em=new Date().toISOString(); clearInterval(asT); render(); setTimeout(refresh, 3000); } }catch(e){} }, 8000); }
const post=b=>fetch(FN,{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({p:P,k:K,...b})}).then(r=>r.json().catch(()=>({})));
function loadSdk(){
  if(sdk) return sdk;
  sdk=new Promise((ok,no)=>{ const s=document.createElement("script");
    s.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(D.cliente_id)}&currency=${encodeURIComponent(D.moeda)}&intent=capture&components=buttons&enable-funding=card`;
    s.onload=ok; s.onerror=no; document.head.appendChild(s); });
  return sdk;
}
/* o servidor não cobra se a lancha já foi para outro cliente ("ocupada") ou se alguém está pagando agora ("pagando") */
function vagaErr(j, msg){ if(j.erro==="ocupada"){ D.indisponivel=true; render(); return true; } if(j.erro==="passou"){ msg.dataset.vaga="1"; msg.innerHTML=`<p class="msg err">${T[lg].late}</p>`; return true; } if(j.erro==="pagando"){ msg.dataset.vaga="1"; msg.innerHTML=`<p class="msg err">${T[lg].busy}</p>`; return true; } return false; }
async function mountPP(){
  const el=document.getElementById("pp"), msg=document.getElementById("ppmsg");
  try{ await loadSdk(); }catch(e){ msg.innerHTML=`<p class="msg err">${T[lg].keys}</p>`; return; }
  if(!document.body.contains(el)) return;
  paypal.Buttons({
    style:{layout:"vertical",shape:"pill",label:"pay"},
    createOrder: async()=>{ const j=await post({acao:"criar"}); if(j.pago){ state="paid"; render(); throw new Error("pago"); } if(vagaErr(j, msg)) throw new Error(j.erro); if(!j.id) throw new Error(j.erro||"criar"); return j.id; },
    onApprove: async data=>{ msg.innerHTML=`<p class="muted">…</p>`; const j=await post({acao:"capturar", order:data.orderID});
      if(j.pago){ state="paid"; D.pago_em=new Date().toISOString(); render(); } else if(j.erro==="pendente") msg.innerHTML=`<p class="msg ok">${T[lg].ppPend}</p>`; else if(!vagaErr(j, msg)) msg.innerHTML=`<p class="msg err">${T[lg].fail}</p>`; },
    onError: ()=>{ if(state!=="paid" && !msg.dataset.vaga) msg.innerHTML=`<p class="msg err">${T[lg].fail}</p>`; }
  }).render(el).catch(()=>{});
}
document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{ lg=b.dataset.lg; try{ localStorage.setItem("pagar-lang",lg); }catch(e){} render(); });
render();
/* a página se atualiza sozinha (Rodrigo 2026-10-22): a cada 20 s e ao voltar para a aba, até a reserva ser confirmada; só redesenha se o andamento mudou */
const sig=d=>d?[d.pago_em,d.comprovante_em,d.confirmada,d.status,d.indisponivel,d.pagando].join("|"):"";
async function refresh(){ if(!D || state==="bad" || D.confirmada || document.hidden) return;
  try{ const r=await fetch(`${FN}?p=${encodeURIComponent(P)}&k=${encodeURIComponent(K)}`,{headers:{apikey:KEY}}); if(!r.ok) return; const n=await r.json(); if(sig(n)!==sig(D)){ D=n; render(); } }catch(e){} }
setInterval(refresh, 20000); document.addEventListener("visibilitychange", refresh);
(async()=>{ try{ if(!P||!K) throw 0; const r=await fetch(`${FN}?p=${encodeURIComponent(P)}&k=${encodeURIComponent(K)}`,{headers:{apikey:KEY}}); if(!r.ok) throw 0; D=await r.json(); state="show";
  if(AS){ try{ A=await fetch(`${FN_AS}?p=${encodeURIComponent(P)}&k=${encodeURIComponent(K)}`,{headers:{apikey:KEY}}).then(r=>r.json()); if(A.pago) state="paid"; else if(A.ativo) asWatch(); }catch(e){ A={ativo:false}; } }
  }catch(e){ state="bad"; } render(); })();
</script>
