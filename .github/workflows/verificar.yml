name: Verificar páginas geradas

on:
  pull_request:

jobs:
  prerender:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar páginas e sitemap.xml (sem enviar)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet --break-system-packages pillow mediapipe==1.2.3
          sudo apt-get install -y -q libegl1 libgles2 >/dev/null || true
          node scripts/prerender.mjs
