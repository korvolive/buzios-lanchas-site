name: Atualizar mapa do código (Graphify)

# Mantém graphify-out/ em dia sozinho a cada mudança no main, sem gastar token.
# O push feito aqui usa o GITHUB_TOKEN, então não dispara o deploy de novo.
# Segurança (revisão 2026-11-15): o Graphify (pacote de terceiros) roda num job SEM permissão de escrita
# e sem o token guardado; o job que grava no main não roda código de terceiros e só aceita graphify-out/.

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapa-graphify
  cancel-in-progress: false

jobs:
  mapa:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Graphify
        run: pip install "graphifyy[sql]==0.9.103"
      - name: Atualizar mapa
        run: |
          graphify update .
          graphify cluster-only . --no-label
      - uses: actions/upload-artifact@v4
        with:
          name: mapa
          path: graphify-out/
          include-hidden-files: true
          retention-days: 1

  salvar:
    needs: mapa
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Guardar mapa atual
        run: cp graphify-out/graph.json /tmp/graph-antes.json
      - uses: actions/download-artifact@v4
        with:
          name: mapa
          path: graphify-out/
      - name: Mudou de verdade?
        id: mudou
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          def chave(p):
              g = json.load(open(p))
              return (json.dumps(g.get("nodes"), sort_keys=True),
                      json.dumps(g.get("links"), sort_keys=True),
                      json.dumps(g.get("hyperedges"), sort_keys=True))
          print("sim=" + ("true" if chave("/tmp/graph-antes.json") != chave("graphify-out/graph.json") else "false"))
          PY
      - name: Salvar no main
        if: steps.mudou.outputs.sim == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add graphify-out
          fora=$(git diff --cached --name-only | grep -v '^graphify-out/' || true)
          if [ -n "$fora" ]; then echo "Arquivo fora de graphify-out/: $fora"; exit 1; fi
          git commit -m "Mapa do código atualizado (Graphify)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
