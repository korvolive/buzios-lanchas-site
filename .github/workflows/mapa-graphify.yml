name: Atualizar mapa do código (Graphify)

# Mantém graphify-out/ em dia sozinho a cada mudança no main, sem gastar token.
# O push feito aqui usa o GITHUB_TOKEN, então não dispara o deploy de novo.

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mapa-graphify
  cancel-in-progress: false

jobs:
  mapa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Graphify
        run: pip install "graphifyy[sql]==0.9.103"
      - name: Guardar mapa atual
        run: cp graphify-out/graph.json /tmp/graph-antes.json
      - name: Atualizar mapa
        run: |
          graphify update .
          graphify cluster-only . --no-label
      - name: Mudou de verdade?
        id: mudou
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          def chave(p):
              g = json.load(open(p))
              return (json.dumps(g.get("nodes"), sort_keys=True),
                      json.dumps(g.get("links"), sort_keys=True),
                      json.dumps(g.get("hyperedges"), sort_keys=True))
          print("sim=" + ("true" if chave("/tmp/graph-antes.json") != chave("graphify-out/graph.json") else "false"))
          PY
      - name: Salvar no main
        if: steps.mudou.outputs.sim == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add graphify-out
          git commit -m "Mapa do código atualizado (Graphify)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
