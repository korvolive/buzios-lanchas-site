name: App Android (Play Store)

# Gera o app Android (TWA) que abre www.lanchaembuzios.com.br.
# A chave de assinatura fica só nos segredos do GitHub (ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD).
# Sem os segredos, gera o pacote sem assinatura, só para conferir que compila.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/android/**
      - .github/workflows/android.yml
      - manifest.webmanifest

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar o projeto Android a partir do manifest do site
        run: |
          npm install --no-save --no-package-lock @bubblewrap/core@1.27.0 # alvo Android 16 (API 36), exigido pela Play Store para apps novos desde 31/08/2026
          node scripts/android/gerar.mjs build-android ${{ github.run_number }}
      - name: Compilar (AAB para a Play Store e APK para testar no celular)
        working-directory: build-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Assinar
        working-directory: build-android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../saida
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -z "$KS_B64" ]; then
            echo "Sem a chave nos segredos: pacote sem assinatura (só teste)."
            cp app/build/outputs/bundle/release/app-release.aab ../saida/buzios-lanchas-SEM-ASSINATURA.aab
            exit 0
          fi
          echo "$KS_B64" | base64 -d > upload.jks
          keytool -list -v -keystore upload.jks -storepass "$KS_PASS" | grep "SHA256:"
          cp app/build/outputs/bundle/release/app-release.aab ../saida/buzios-lanchas.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" ../saida/buzios-lanchas.aab upload
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          "$BT/apksigner" sign --ks upload.jks --ks-pass env:KS_PASS --ks-key-alias upload --out ../saida/buzios-lanchas.apk app-aligned.apk
          rm -f upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ github.run_number }}
          path: saida/
          retention-days: 30
