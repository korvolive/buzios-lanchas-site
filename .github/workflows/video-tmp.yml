name: video-tmp
on:
  push:
    branches: [video-tmp]
jobs:
  checar:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sI https://www.lanchaembuzios.com.br/video/miss-bardot.mp4 | grep -iE "^HTTP|content-length|content-type"
          curl -sI https://www.lanchaembuzios.com.br/img/miss-bardot-video.jpg | grep -iE "^HTTP|content-length"
          curl -s https://www.lanchaembuzios.com.br/lancha/miss-bardot/ | grep -o '<video[^>]*>' | head -2
          curl -s https://www.lanchaembuzios.com.br/login/ | grep -c "loadTaken"
