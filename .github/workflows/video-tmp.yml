name: video-tmp
on:
  push:
    branches: [video-tmp]
jobs:
  comprimir:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Achar e baixar o vídeo
        run: |
          set -e
          curl -sL --fail "https://www.lanchaembuzios.com.br/videos/Miss%20Bardot%20v1.mov" -o in.vid
          ls -l in.vid
      - name: Comprimir
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,r_frame_rate -of compact in.vid
          mkdir out
          ffmpeg -v error -y -i in.vid -vf "scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)'" -c:v libx264 -preset slow -crf 28 -profile:v high -pix_fmt yuv420p -c:a aac -b:a 96k -ac 2 -movflags +faststart out/miss-bardot.mp4
          ffmpeg -v error -y -ss 2 -i in.vid -frames:v 1 -vf "scale='if(gt(iw,ih),-2,1080)':'if(gt(iw,ih),1080,-2)'" -q:v 4 out/miss-bardot-capa.jpg
          ffprobe -v error -show_entries format=duration,size:stream=width,height -of compact out/miss-bardot.mp4
          ls -l out
      - name: Publicar em branch
        run: |
          set -e
          cd out && git init -q -b video-out && git add . \
          && git -c user.name=ci -c user.email=ci@x commit -qm video \
          && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-out
