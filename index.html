})();

const fmtDate = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(t("locale"),lang==="pt"?{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}:{weekday:"short",day:"numeric",month:"short",year:"numeric"}); };
const seasonOf = iso => SEASONS.find(s=>s.m.includes(+iso.split("-")[1]));

/* Planilha do dono: coluna A = data ocupada, coluna B = horário (vazio = dia todo).
   A planilha precisa estar compartilhada como "qualquer pessoa com o link pode ver". */
const agendas = {};
function sheetSlot(v){
  const s = String(v??"").toLowerCase().replace(/\s/g,"");
  if(!s || s.includes("todo") || s.includes("17")) return "dia";
  if(s.startsWith("10") || s.includes("manh")) return "manha";
  if(s.startsWith("14") || s.includes("tard")) return "tarde";
  return "dia"; /* texto não reconhecido: bloqueia o dia todo por segurança */
}
function sheetDate(c){
  if(!c) return null;
  let m = /^Date\((\d+),(\d+),(\d+)/.exec(c.v);
  if(m) return `${m[1]}-${pad(+m[2]+1)}-${pad(m[3])}`;
  const t = String(c.v ?? c.f ?? "").trim();
  if((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(t))) return `${m[3].length===2?"20"+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return null;
}
/* devolve um mapa data → horários ocupados, ou null se não for possível ler a planilha */
function loadAgenda(b){
  if(!b.agenda) return Promise.resolve(null);
  if(agendas[b.slug]) return agendas[b.slug];
  const id = (/\/d\/([\w-]+)/.exec(b.agenda)||[])[1] || b.agenda;
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=1&tq=${encodeURIComponent("select A,B")}`;
  return agendas[b.slug] = fetch(url).then(r=>r.text()).then(t=>{
    const rows = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}")+1)).table.rows || [];
    const busy = new Map();
    rows.forEach(r=>{ const d=sheetDate(r.c[0]); if(!d) return;
      if(!busy.has(d)) busy.set(d,new Set()); busy.get(d).add(sheetSlot(r.c[1]&&(r.c[1].v??r.c[1].f))); });
    return busy;
  }).catch(()=>{ delete agendas[b.slug]; return null; });
}
/* "livre" ou "ocupada"; lancha sem planilha (ou planilha fora do ar) fica sempre livre */
async function statusFor(b,iso,slot){
  const busy = await loadAgenda(b);
  if(!busy) return "livre";
  const s = busy.get(iso); if(!s) return "livre";
  if(s.has("dia") || s.has(slot) || (slot==="dia" && s.size)) return "ocupada";
  return "livre";
}

function bindPicker(onChange){

let seq = 0;
async function showBoatStatus(b){
  const out=document.getElementById("pk-out"), btn=document.getElementById("book-btn"); if(!out||!btn) return;
  btn.href=waLink(b.name); btn.textContent=t("askDate");

  if(s==="ocupada"){ out.innerHTML=`<p class="pk-res busy">${t("busy",{date:fmtDate(pick.date), slot:slotLabel(pick.slot)})}</p>`; return; }
  out.innerHTML="";
  btn.href=waBook(b,pick.date,pick.slot); btn.textContent=t("askAvail");
}

function bindGallery(b){
  if(!b||!b.photos) return; let i=0; const P=b.photos;

  const show=n=>{ i=(n+P.length)%P.length; const m=document.getElementById("g-main");

}

                ${b.example?`<div class="example-banner">${t("exampleBanner")}</div>`:""}
        <div class="pk-boat"><h3>${t("pickTitle")}</h3>${pickerHTML()}<div id="pk-out" aria-live="polite"></div></div>
        <a class="btn" id="book-btn" href="${waLink(b.name)}" target="_blank" rel="noopener">${t("askDate")}</a>
        <div class="phone"><span id="ph-num">(21) 99927-2550</span><button type="button" id="copy">${t("copy")}</button></div>
        <p class="fine">${t("fine")}</p>
      </aside>
    </div>
  </div>`;
}

/* ============ roteamento ============ */
const app = document.getElementById("app");
function render(toTop=true){
  const h = location.hash.slice(1);
  const b = h.startsWith("lancha-") && BOATS.find(x=>"lancha-"+x.slug===h);
  app.innerHTML = b ? boatPage(b) : home();
  document.title = b ? `${b.name} · Búzios Lanchas` : "Búzios Lanchas";
  if(b && toTop) window.scrollTo(0,0);
  bind(); bindGallery(b);
  if(b) bindPicker(()=>showBoatStatus(b));
}
function bind(){
  const so=document.getElementById("sort"); if(so) so.onclick=()=>{sortDir=sortDir==="asc"?"desc":"asc"; render(); document.getElementById("frota").scrollIntoView();};
  app.querySelectorAll("[data-f]").forEach(btn=>btn.onclick=()=>{filter=btn.dataset.f; sortDir="asc"; render(); document.getElementById("frota").scrollIntoView();});
  bindScroll();
  const c=document.getElementById("copy");
  if(c) c.onclick=()=>{ const tt=document.getElementById("ph-num").textContent;
    try{ navigator.clipboard.writeText(tt).then(()=>c.textContent=t("copied"),()=>sel()); }catch(e){ sel(); }
    function sel(){ const r=document.createRange(); r.selectNodeContents(document.getElementById("ph-num")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } };
  waves();
}
function bindScroll(){
  document.querySelectorAll("[data-scroll]").forEach(a=>a.onclick=e=>{
    const id=a.dataset.scroll;
    /* "Ver todas as lanchas" e "Lanchas" (menu) sempre voltam para o filtro Todas */
    if(id==="frota" && filter!=="todas"){ filter="todas"; sortDir="asc"; if(document.getElementById(id)){ e.preventDefault(); render(); document.getElementById(id).scrollIntoView({behavior:"smooth"}); return; } }
    if(!document.getElementById(id)){ location.hash="inicio"; setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:"smooth"}),30);} else {e.preventDefault(); document.getElementById(id).scrollIntoView({behavior:"smooth"});}
  });
}
window.addEventListener("hashchange",()=>render());

/* ondas do hero */
let raf;
function waves(){
  cancelAnimationFrame(raf);
  const cv=document.getElementById("waves"); if(!cv) return;
  const ctx=cv.getContext("2d"); const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t=0;
  function draw(){
    const w=cv.width=cv.clientWidth*devicePixelRatio, h=cv.height=cv.clientHeight*devicePixelRatio;
    ctx.clearRect(0,0,w,h);
    [[.10,.9,"rgba(79,179,204,.18)"],[.16,1.3,"rgba(79,179,204,.12)"],[.22,.7,"rgba(201,154,46,.14)"]].forEach(([amp,sp,col],i)=>{
      ctx.beginPath(); ctx.moveTo(0,h);
      for(let x=0;x<=w;x+=8){ ctx.lineTo(x, h*(.45+i*.15) + Math.sin(x/(110*devicePixelRatio)+t*sp+i)*h*amp); }
      ctx.lineTo(w,h); ctx.fillStyle=col; ctx.fill();
    });
    t+=.012; if(!reduce) raf=requestAnimationFrame(draw);
  }
  draw();
}
applyStatic();
render();
</script>
