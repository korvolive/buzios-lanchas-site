const boatSVG = `<svg viewBox="0 0 200 90" aria-hidden="true"><path d="M8 58h184l-22 24H34z" fill="currentColor"/><path d="M52 58l16-22h70l18 22z" fill="currentColor" opacity=".55"/><rect x="80" y="40" width="40" height="8" rx="2" fill="currentColor" opacity=".35"/><path d="M0 86c20-6 40 6 60 0s40 6 60 0 40 6 60 0 20 4 20 4" stroke="currentColor" stroke-width="2" fill="none" opacity=".5"/></svg>`;
const ph = (note) => `<div class="ph">${boatSVG}<span class="note">${note}</span></div>`;
const specs = b => `<div class="specs"><div><b>${b.feet??"—"}</b>pés</div><div><b>${b.capacity}</b>pessoas</div><div><b>${b.included.length}</b>itens inclusos</div></div>`;

document.getElementById("hdr-wa").href = waLink("frota");

/* ============ vitrine ============ */
let filter = "todas";
let sortDir = "asc";
function home(){
  const dir = filter==="todas" ? -1 : (sortDir==="asc"?1:-1);
  const sorted = [...BOATS].sort((a,b)=>dir*((a.capacity-b.capacity)||((a.feet||0)-(b.feet||0))));
  const MIN = {todas:1, ate6:1, ate10:7, mais10:11};
  const list = sorted.filter(b=> b.capacity>=MIN[filter]);
  return `
  <section class="hero" id="inicio">
    <div class="wrap hero-grid"><div class="hero-text">
      <span class="coords">22°45′S · 41°53′O — Armação dos Búzios, RJ</span>
      <h1>Seu dia no mar de Búzios, na <em>lancha certa</em> para o seu grupo.</h1>
      <p>Passeios privativos com marinheiro, combustível, gelo e água mineral inclusos. Traga suas bebidas e carnes que a equipe prepara o churrasco a bordo. De casais a grupos de até 16 pessoas.</p>
      <div class="ctas"><a class="btn" href="#lancha-miss-bardot">Conhecer a Miss Bardot</a><a class="btn ghost" href="#inicio" data-scroll="frota">Ver todas as lanchas</a></div>
    </div>
    <a class="hero-photo" href="#lancha-miss-bardot"><img src="img/mb-01.jpg" alt="Lancha Miss Bardot ancorada em Búzios"><span>Miss Bardot · 35 pés · até 16 pessoas</span></a>
    </div>
    <canvas id="waves" aria-hidden="true"></canvas>
  </section>
  <section class="section" id="frota"><div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow">Nossa frota</span><h2>Escolha pelo tamanho do grupo</h2></div>
      <div class="filters" role="group" aria-label="Filtrar por capacidade">
        ${[["todas","Todas"],["ate6","Até 6 pessoas"],["ate10","Até 10 pessoas"],["mais10","Acima de 10 pessoas"]].map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}
        ${filter==="todas"?"":`<button type="button" id="sort" class="sort" aria-label="Inverter ordem">${sortDir==="asc"?"Menor → maior ↑":"Maior → menor ↓"}</button>`}
      </div>
    </div>
    ${list.length?"":`<p style="color:var(--muted)">Ainda não temos lanchas nessa faixa. Chame no WhatsApp que encontramos uma opção para o seu grupo.</p>`}
    <div class="grid">
      ${list.map(b=>`
        <a class="card" href="#lancha-${b.slug}">
          ${b.photos?`<div class="ph"><img src="img/${b.photos[0][0]}-t.jpg" srcset="img/${b.photos[0][0]}-t.jpg 360w, img/${b.photos[0][0]}.jpg 1000w" sizes="(max-width:700px) 92vw, 380px" alt="${b.photos[0][1]}" style="object-position:${b.photos[0][2]}" loading="lazy"></div>`:ph("Foto da lancha")}
          <div class="body">
            ${b.featured?`<span class="tag">Destaque da casa</span>`:b.example?`<span class="tag ex">Exemplo</span>`:""}
            <h3>${b.name}</h3>
            <p style="margin:0;color:var(--muted)">${b.tagline}</p>
            ${specs(b)}
            <div class="price-from"><div><span>Passeio de 4h · a partir de</span><br><strong>${minPrice(b)?brl(minPrice(b)):"Sob consulta"}</strong></div><span class="go">Ver lancha →</span></div>
          </div>
        </a>`).join("")}
    </div>
  </div></section>
  <section class="section" id="como" style="padding-top:0"><div class="wrap">
    <div class="section-head"><div><span class="eyebrow">Reserva</span><h2>Como funciona</h2></div></div>
    <div class="how">
      <div><h3>Escolha a lancha</h3><p>Compare tamanho, capacidade e o que vem incluso.</p></div>
      <div><h3>Chame no WhatsApp</h3><p>Confirmamos a disponibilidade da data e o roteiro.</p></div>
      <div><h3>Garanta com o sinal</h3><p>Um sinal de pagamento reserva o seu dia.</p></div>
      <div><h3>Embarque</h3><p>Se o mar não estiver seguro, remarcamos sem custo.</p></div>
    </div>
  </div></section>`;
}

/* ============ galeria ============ */
function gallery(b){
  const P=b.photos;
  return `<div class="gallery" data-i="0">
    <div class="main tall"><img class="blur" id="g-blur" src="img/${P[0][0]}-t.jpg" alt="" aria-hidden="true"><img id="g-main" class="fit" src="img/${P[0][0]}.jpg" alt="${P[0][1]}" style="object-position:${P[0][2]}">
      <button type="button" class="nav prev" id="g-prev" aria-label="Foto anterior">‹</button>
      <button type="button" class="nav next" id="g-next" aria-label="Próxima foto">›</button>
      <span class="count" id="g-count">1 / ${P.length}</span></div>
    <p class="cap" id="g-cap">${P[0][1]}</p>
    <div class="strip" id="g-strip">${P.map((p,i)=>`<button type="button" data-g="${i}" aria-label="${p[1]}" ${i?"":'aria-current="true"'}><img src="img/${p[0]}-t.jpg" alt="" loading="lazy"></button>`).join("")}</div>
  </div>`;
}
function bindGallery(b){
  if(!b||!b.photos) return; let i=0; const P=b.photos;
  const mm=document.getElementById("g-main");
  const fit=()=>{ mm.style.objectFit = mm.naturalWidth>mm.naturalHeight ? "contain" : "cover"; };
  mm.addEventListener("load",fit); if(mm.complete) fit();
  const show=n=>{ i=(n+P.length)%P.length; const m=document.getElementById("g-main");
    m.src=`img/${P[i][0]}.jpg`; m.alt=P[i][1]; m.style.objectPosition=P[i][2]; document.getElementById("g-blur").src=`img/${P[i][0]}-t.jpg`;
    document.getElementById("g-cap").textContent=P[i][1]; document.getElementById("g-count").textContent=`${i+1} / ${P.length}`;
    document.querySelectorAll("#g-strip button").forEach((t,k)=>{ if(k===i){t.setAttribute("aria-current","true"); t.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});} else t.removeAttribute("aria-current"); }); };
  document.getElementById("g-prev").onclick=()=>show(i-1);
  document.getElementById("g-next").onclick=()=>show(i+1);
  document.querySelectorAll("#g-strip button").forEach(t=>t.onclick=()=>show(+t.dataset.g));
  let x0=null; const m=document.querySelector(".gallery .main");
  m.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
  m.addEventListener("touchend",e=>{ if(x0==null) return; const d=e.changedTouches[0].clientX-x0; if(Math.abs(d)>40) show(i+(d<0?1:-1)); x0=null; });
}

/* ============ página da lancha ============ */
function boatPage(b){
  const mp = minPrice(b);
  return `
  <div class="wrap">
    <div class="crumb"><a href="#inicio">← Frota</a> / ${b.name}</div>
    <div class="boat">
      <div class="b-info">
        <div>
          <span class="eyebrow">${b.featured?"Destaque da casa":"Lancha"}</span>
          <h1 style="margin-top:8px">${b.name}</h1>
          <p class="lead">${b.description}</p>
          <div class="spec-row">
            <div><b>${b.feet??"—"}</b><span>Pés</span></div>
            <div><b>${b.capacity}</b><span>Pessoas</span></div>
            <div><b>4h / 7h</b><span>Passeios</span></div>
          </div>
        </div>
        <div class="block"><h2>Incluso no passeio</h2><ul class="included">${b.included.map(i=>(b.highlight||[]).includes(i)?`<li class="hl">★ ${i}</li>`:`<li>${i}</li>`).join("")}</ul></div>
        <div class="block"><h2>O que trazer</h2><p style="color:var(--muted);margin:6px 0 0">Comidas e bebidas não estão inclusas no passeio. Traga as suas: a lancha já tem gelo e cooler, e se vocês trouxerem carnes ou peixes, a equipe prepara o churrasco a bordo.</p></div>
        <div class="block"><h2>Tripulação e segurança</h2><p style="color:var(--muted);margin:6px 0 0">${b.crew}. Coletes salva-vidas para todos, extintores em dia e revisões periódicas nos motores.</p></div>
      </div>
      <div class="b-media">
        <div class="block"><h2>Fotos</h2><div style="margin-top:12px">${b.photos?gallery(b):`<div class="gallery"><div class="main">${ph("Foto principal")}</div><div class="thumbs">${[1,2,3,4].map(i=>ph(""+i)).join("")}</div></div>`}</div></div>
        <div class="block"><h2>Vídeo</h2>${b.video?`<video class="vid" src="${b.video}" controls playsinline preload="metadata" ${b.photos?`poster="img/${b.photos[0][0]}.jpg"`:""}></video>`:`<div class="vid empty">${b.photos?`<img src="img/${b.photos[0][0]}.jpg" alt="">`:""}<div><span class="play" aria-hidden="true">▶</span><strong>Vídeo em breve</strong><small>O vídeo da ${b.name} aparece aqui.</small></div></div>`}</div>
      </div>
      <aside class="pricebox" aria-label="Preços">
        <h2>Valores</h2>
        <p class="from">Passeio de 4 horas · a partir de <strong>${mp?brl(mp):"Sob consulta"}</strong></p>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Temporada</th><th>4 horas</th></tr></thead>
          <tbody>${SEASONS.map(s=>`<tr><td class="season"><span class="dot" style="background:${s.color}"></span>${s.label.replace(" temporada","")}<small>${s.months}</small></td><td>${b.prices[s.key]==null?"Sob consulta":brl(b.prices[s.key])}</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="long">
          <span class="long-tag">Dia completo</span>
          <div class="long-head"><strong>Passeio de 7 horas</strong><span>${b.price7h?`a partir de ${brl(b.price7h)}`:"Valor sob consulta"}</span></div>
          <p>Mais praias, mais tempo de mergulho e churrasco sem pressa. Ideal para aproveitar o dia inteiro no mar.</p>
        </div>
                ${b.example?`<div class="example-banner">Valores de exemplo, não são preços reais.</div>`:""}
        <a class="btn" href="${waLink(b.name)}" target="_blank" rel="noopener">Consultar data no WhatsApp</a>
        <div class="phone"><span id="ph-num">(21) 99927-2550</span><button type="button" id="copy">Copiar</button></div>
        <p class="fine">Valores a partir de, por lancha e não por pessoa. A tabela mostra o passeio de 4 horas; o de 7 horas tem valor próprio. Consulte condições especiais para dias de semana. Sinal garante a data. Remarcação sem custo em caso de mar inseguro.</p>
      </aside>
    </div>
  </div>`;
}

/* ============ roteamento ============ */
const app = document.getElementById("app");
function render(){
  const h = location.hash.slice(1);
  const b = h.startsWith("lancha-") && BOATS.find(x=>"lancha-"+x.slug===h);
  app.innerHTML = b ? boatPage(b) : home();
  document.title = b ? `${b.name} · Búzios Lanchas` : "Búzios Lanchas";
  if(b) window.scrollTo(0,0);
  bind(); bindGallery(b);
}
function bind(){
  const so=document.getElementById("sort"); if(so) so.onclick=()=>{sortDir=sortDir==="asc"?"desc":"asc"; render(); document.getElementById("frota").scrollIntoView();};
  app.querySelectorAll("[data-f]").forEach(btn=>btn.onclick=()=>{filter=btn.dataset.f; sortDir="asc"; render(); document.getElementById("frota").scrollIntoView();});
  document.querySelectorAll("[data-scroll]").forEach(a=>a.onclick=e=>{
    const id=a.dataset.scroll; if(!document.getElementById(id)){ location.hash="inicio"; setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:"smooth"}),30);} else {e.preventDefault(); document.getElementById(id).scrollIntoView({behavior:"smooth"});}
  });
  const c=document.getElementById("copy");
  if(c) c.onclick=()=>{ const t=document.getElementById("ph-num").textContent;
    try{ navigator.clipboard.writeText(t).then(()=>c.textContent="Copiado",()=>sel()); }catch(e){ sel(); }
    function sel(){ const r=document.createRange(); r.selectNodeContents(document.getElementById("ph-num")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } };
  waves();
}
window.addEventListener("hashchange",render);

/* ondas do hero */
let raf;
function waves(){
  cancelAnimationFrame(raf);
  const cv=document.getElementById("waves"); if(!cv) return;
  const ctx=cv.getContext("2d"); const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t=0;
  function draw(){
    const w=cv.width=cv.clientWidth*devicePixelRatio, h=cv.height=cv.clientHeight*devicePixelRatio;
    ctx.clearRect(0,0,w,h);
    [[.10,.9,"rgba(79,179,204,.18)"],[.16,1.3,"rgba(79,179,204,.12)"],[.22,.7,"rgba(201,154,46,.14)"]].forEach(([amp,sp,col],i)=>{
      ctx.beginPath(); ctx.moveTo(0,h);
      for(let x=0;x<=w;x+=8){ ctx.lineTo(x, h*(.45+i*.15) + Math.sin(x/(110*devicePixelRatio)+t*sp+i)*h*amp); }
      ctx.lineTo(w,h); ctx.fillStyle=col; ctx.fill();
    });
    t+=.012; if(!reduce) raf=requestAnimationFrame(draw);
  }
  draw();
}
render();
</script>
