/* App dos donos: login, calendário da lancha (toque no dia para marcar o horário alugado) e, para o administrador, cadastro de donos */
:root{
  --bg:#f3f7f8; --surface:#ffffff; --ink:#0c2430; --muted:#55707b; --line:#d6e2e6;
  --sea:#0b5c73; --sea-deep:#06394a; --brass:#c99a2e; --brass-ink:#3d2c06; --chip:#e3eff2;
  --half:#f6e7bf; --half-ink:#5a4105; --full:#06394a; --full-ink:#ffffff; --bad:#b3261e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071a22; --surface:#0d2531; --ink:#e6f1f4; --muted:#93aeb8; --line:#1d3a47;
  --sea:#4fb3cc; --sea-deep:#0a2e3b; --brass:#e0b54d; --brass-ink:#2a1e03; --chip:#123241;
  --half:#4a3a12; --half-ink:#f6e3ad; --full:#4fb3cc; --full-ink:#04202a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071a22; --surface:#0d2531; --ink:#e6f1f4; --muted:#93aeb8; --line:#1d3a47;
  --sea:#4fb3cc; --sea-deep:#0a2e3b; --brass:#e0b54d; --brass-ink:#2a1e03; --chip:#123241;
  --half:#4a3a12; --half-ink:#f6e3ad; --full:#4fb3cc; --full-ink:#04202a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--sea-deep);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;border-radius:9px}
.top .ttl{flex:1;min-width:0;line-height:1.15}
.top .ttl strong{display:block;font:800 18px/1.1 var(--display)}
.top .ttl span{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top select,.top .out{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 10px;font-size:14px}
.top select option{color:#000}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--display);line-height:1.15;margin:0 0 6px}
h1{font-size:26px} h2{font-size:20px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 16px}
label.f{display:block;margin:0 0 14px}
label.f span{display:block;font-weight:600;margin:0 0 6px}
input[type=email],input[type=password],input[type=text],input[type=tel],input[type=number],select.in{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:17px}
input:focus,select.in:focus{outline:none;border-color:var(--sea)}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sea);font-weight:600;font-size:14px;padding:8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:17px;text-align:center;text-decoration:none}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--sea);font-weight:600;padding:10px 0;text-decoration:underline}
.msg{padding:12px 14px;border-radius:12px;margin:0 0 14px;font-size:15px}
.msg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.msg.ok{background:var(--chip)}
.login{padding-top:24px}
.login .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 0 16px}
.boats{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.boats button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.boats button[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.how{margin:0 0 14px;font-size:15px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.cal-head h2{margin:0}
.cal-head button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.cal-head button:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:2px 0}
.day{aspect-ratio:1/1.08;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-width:0}
.day b{font-size:16px}
.day small{font-size:10px;font-weight:700;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;max-width:100%}
.day.half{background:var(--half);border-color:var(--half);color:var(--half-ink)}
.day.full{background:var(--full);border-color:var(--full);color:var(--full-ink)}
.day.today{outline:2.5px solid var(--brass);outline-offset:1px}
.day.past{opacity:.38}
.day.empty{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:12px 0 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1.5px solid var(--line);background:var(--surface)}
.legend i.half{background:var(--half);border-color:var(--half)} .legend i.full{background:var(--full);border-color:var(--full)}
.up{list-style:none;margin:0;padding:0}
.up li button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 2px}
.up li:first-child button{border-top:0}
.up .tag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--half);color:var(--half-ink);white-space:nowrap}
.up .tag.full{background:var(--full);color:var(--full-ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.opt{width:100%;display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;margin:0 0 10px;text-align:left}
.opt .box{flex:none;width:30px;height:30px;border-radius:9px;border:2.5px solid var(--muted);display:grid;place-items:center;font-weight:800;font-size:18px}
.opt div{flex:1}
.opt strong{display:block;font-size:17px}
.opt span{font-size:14px;color:var(--muted)}
.opt em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted)}
.opt[aria-checked=true]{border-color:var(--sea-deep);background:var(--full);color:var(--full-ink)}
.opt[aria-checked=true] span,.opt[aria-checked=true] em{color:inherit;opacity:.85}
.opt[aria-checked=true] .box{border-color:currentColor;background:currentColor}
.opt[aria-checked=true] .box::after{content:"✓";color:var(--full)}
.opt:disabled{opacity:.55}
.opt.saving{opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:30;transition:transform .2s;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.install{display:flex;gap:12px;align-items:flex-start}
.install p{margin:0;font-size:15px;flex:1}
.install .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.owners{list-style:none;margin:10px 0 0;padding:0;font-size:15px}
.owners li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.owners li span{word-break:break-all}
ol.steps{margin:0 0 14px;padding-left:20px;font-size:15px}
.note-btn{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 12px;margin:-4px 0 12px;font-size:14px;color:var(--sea);font-weight:600}
.note-btn span{color:var(--ink);font-weight:400}
.nform textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font:inherit;font-size:16px;resize:vertical}
.nform label.f{margin-bottom:10px} .nform input{padding:12px} .nform label.f span{font-size:14px}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.sheet{max-height:92vh;overflow-y:auto}
.sum{margin:12px 0 0;padding:10px 12px;background:var(--chip);border-radius:12px;font-weight:600;font-size:15px}
.sum small{font-weight:400;color:var(--muted)}
.up li button > span:first-child{min-width:0}
.origin{border:0;padding:0;margin:0 0 12px}
.origin legend{font-weight:600;font-size:14px;margin:0 0 6px;padding:0}
.origin div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.origin button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;font-size:14px;font-weight:600;line-height:1.2}
.origin button[aria-checked=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.org{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--chip);color:var(--sea)}
.org-fora{background:var(--half);color:var(--half-ink)}
.org-buzios{background:var(--brass);color:var(--brass-ink)}
.loading{text-align:center;color:var(--muted);padding:40px 0}

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const brl = v => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});

/* ===== login: a sessão fica guardada no celular e é renovada sozinha ===== */
let ses = store.get("dono-ses");
const saveSes = s => { ses = s ? {access_token:s.access_token, refresh_token:s.refresh_token,
  expires_at: s.expires_at || Math.floor(Date.now()/1000) + (+s.expires_in||3600), user:s.user || ses?.user} : null; store.set("dono-ses",ses); };
async function authCall(path, body, method="POST", token){
  const r = await fetch(SB+"/auth/v1/"+path, {method, headers:{apikey:KEY, "content-type":"application/json", ...(token?{authorization:"Bearer "+token}:{})}, body: body && JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.msg||j.error_description||j.message||r.status), {code:j.error_code||j.error||"", status:r.status});
  return j;
}
let refreshing = null;
async function fresh(force){
  if(!ses) throw new Error("sem sessão");
  if(!force && ses.expires_at - Date.now()/1000 > 60) return ses.access_token;
  refreshing ||= authCall("token?grant_type=refresh_token", {refresh_token:ses.refresh_token})
    .then(s=>{ saveSes(s); return ses.access_token; })
    .catch(e=>{ if(e.status>=400 && e.status<500){ saveSes(null); show(); } throw e; })
    .finally(()=>refreshing=null);
  return refreshing;
}
/* chamada ao banco já com o login; se a sessão venceu, renova e tenta mais uma vez */
async function db(path, {method="GET", body, prefer}={}, retry=true){
  const tok = await fresh();
  const r = await fetch(SB+"/rest/v1/"+path, {method, headers:{apikey:KEY, authorization:"Bearer "+tok, "content-type":"application/json", ...(prefer?{prefer}:{})}, body: body && JSON.stringify(body)});
  if(r.status===401 && retry){ await fresh(true); return db(path,{method,body,prefer},false); }
  const txt = await r.text(); const j = txt ? JSON.parse(txt) : null;
  if(!r.ok) throw Object.assign(new Error(j?.message||r.status), {status:r.status, code:j?.code});
  return j;
}

const daySize = s => s ? s.size - (s.has("noite")?1:0) : 0;

const withNight = (s,txt,key) => s.has("noite") ? (txt ? txt+"+"+t(key==="c"?"c_noite":"slot_noite") : t(key==="c"?"c_noite":"slot_noite")) : txt;

/* ===== agenda: busca os horários marcados do mês na tela e os próximos dias (com os dados do cliente) ===== */
let loadSeq = 0;
const NOTE_COLS = "anotacoes(origem,cliente,telefone,pessoas,valor,sinal,obs)";
const rowOf = r => ({id:r.id, data:r.data, horario:r.horario, nota:(Array.isArray(r.anotacoes)?r.anotacoes[0]:r.anotacoes)||null});
async function fetchRows(q){
  if(S.notes){ try{ return (await db(`bloqueios?select=id,data,horario,${NOTE_COLS}&${q}`)).map(rowOf); }
    catch(e){ if(e.status!==400 && e.status!==404) throw e; S.notes=false; } } /* tabela de anotações ainda não criada */
  return (await db(`bloqueios?select=id,data,horario&${q}`)).map(rowOf);
}
const SLOT_ORDER = {dia:0, manha:1, tarde:2, noite:3};
async function loadBlocks(){
  if(!S.cur) return mainView();
  const my=++loadSeq, y=S.month.getFullYear(), mo=S.month.getMonth();
  const a=iso(new Date(y,mo,1)), b=iso(new Date(y,mo+1,0)), l=encodeURIComponent(S.cur);
  try{
    const [rows, up] = await Promise.all([
      fetchRows(`lancha=eq.${l}&data=gte.${a}&data=lte.${b}`),
      fetchRows(`lancha=eq.${l}&data=gte.${todayISO()}&order=data.asc&limit=60`)]);
    if(my!==loadSeq) return;
    S.blocks = new Map(); rows.forEach(r=>{ if(!S.blocks.has(r.data)) S.blocks.set(r.data,new Map()); S.blocks.get(r.data).set(r.horario,r); });
    S.upcoming = up.sort((x,z)=>x.data<z.data?-1:x.data>z.data?1:SLOT_ORDER[x.horario]-SLOT_ORDER[z.horario]); S.err="";
  }catch(e){ if(my!==loadSeq || !ses) return; S.err="load"; }
  mainView();
}

function openDay(d){ sheetDay=d; renderSheet(); sheet.classList.add("on"); sheetBg.classList.add("on"); }
function closeDay(){ sheet.classList.remove("on"); sheetBg.classList.remove("on"); sheetDay=null; noteFor=null; }
sheetBg.onclick = closeDay;
let noteFor = null; /* horário cuja anotação está aberta na janela */
function renderSheet(busy){
  if(noteFor) return renderNote();
  const d=sheetDay, s=S.blocks.get(d)||new Map(), dia=s.has("dia");
  sheet.innerHTML = `<div class="grab"></div><h2>${fmtLong(d)}</h2><p class="muted" style="margin-top:0">${t("sheetSub")}</p>
    ${["manha","tarde","dia",...(hasNight(d)?["noite"]:[])].map(k=>{ const r=s.get(k), on=!!r, inc = (k==="manha"||k==="tarde") && dia && !on;
      return `<button type="button" class="opt${busy===k?" saving":""}" role="checkbox" aria-checked="${on}" data-s="${k}"${inc||busy?" disabled":""}>
        <span class="box"></span><div><strong>${t("slot_"+k)}</strong><span>${t("hours_"+k)}</span></div><em>${on?t("rented"):inc?t("inDay"):t("free")}</em></button>`
        + (on && S.notes ? `<button type="button" class="note-btn" data-n="${k}">${r.nota&&noteLine(r.nota) ? `<span>${noteLine(r.nota)}</span><b>✎</b>` : t("addNote")}</button>` : ""); }).join("")}
    <button class="btn" id="sheetx" style="margin-top:6px">${t("close")}</button>`;
  document.getElementById("sheetx").onclick = closeDay;
  sheet.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>toggle(d,x.dataset.s));
  sheet.querySelectorAll("[data-n]").forEach(x=>x.onclick=()=>{ noteFor=x.dataset.n; renderSheet(); });
}
function renderNote(){
  const d=sheetDay, r=S.blocks.get(d)?.get(noteFor); if(!r){ noteFor=null; return renderSheet(); }
  const n=r.nota||{}, f=(k,type,extra="")=>`<label class="f"><span>${t(k==="cliente"?"client":k==="telefone"?"phone":k==="pessoas"?"people":k==="valor"?"value":k==="sinal"?"deposit":"obs")}</span>${
    type==="area"?`<textarea id="n-${k}" rows="2" placeholder="${t("ph_obs")}">${esc(n[k]??"")}</textarea>`
    :`<input type="${type}" id="n-${k}" ${extra} placeholder="${t("ph_"+({cliente:"client",telefone:"phone",pessoas:"people",valor:"value",sinal:"deposit"}[k]))}" value="${esc(n[k]??"")}">`}</label>`;
  const digits=String(n.telefone||"").replace(/\D/g,""), waNum = digits.length>=10 && digits.length<=11 ? "55"+digits : digits;
  sheet.innerHTML = `<div class="grab"></div><h2>${t("noteTitle")}</h2><p class="muted" style="margin-top:0">${fmtLong(d)} · ${t("slot_"+noteFor)}<br><small>${t("noteSub")}</small></p>
    <form id="nform" class="nform">
      <fieldset class="origin"><legend>${t("closedBy")}</legend><div>${["buzios","fora"].map(o=>`<button type="button" role="radio" data-o="${o}" aria-checked="${n.origem===o}">${t("o_"+o)}</button>`).join("")}</div></fieldset>
      ${f("cliente","text",'autocapitalize="words"')}
      <div class="row2">${f("telefone","tel",'inputmode="tel"')}${f("pessoas","number",'inputmode="numeric" min="1" max="99"')}</div>
      <div class="row2">${f("valor","number",'inputmode="decimal" min="0" step="any"')}${f("sinal","number",'inputmode="decimal" min="0" step="any"')}</div>
      ${f("obs","area")}
      ${waNum.length>=12?`<a class="btn sec" style="margin:0 0 10px" href="https://wa.me/${waNum}" target="_blank" rel="noopener">WhatsApp ${esc(n.cliente||"")}</a>`:""}
      <button class="btn" id="nsave">${t("save")}</button></form>
    <button type="button" class="btn sec" id="nback" style="margin-top:10px">${t("back")}</button>`;
  document.getElementById("nback").onclick=()=>{ noteFor=null; renderSheet(); };
  let origem = n.origem || null;
  sheet.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>{ origem = origem===x.dataset.o ? null : x.dataset.o;
    sheet.querySelectorAll("[data-o]").forEach(y=>y.setAttribute("aria-checked", y.dataset.o===origem)); });
  document.getElementById("nform").onsubmit = async e => { e.preventDefault();
    const g=k=>document.getElementById("n-"+k).value.trim(), num=k=>{ const v=g(k).replace(",","."); return v===""?null:+v; };
    const nota={origem, cliente:g("cliente")||null, telefone:g("telefone")||null, pessoas:num("pessoas"), valor:num("valor"), sinal:num("sinal"), obs:g("obs")||null};
    const b=document.getElementById("nsave"); b.disabled=true;
    try{ await db("anotacoes",{method:"POST", body:{bloqueio_id:r.id, ...nota}, prefer:"resolution=merge-duplicates,return=minimal"});
      r.nota=nota; const u=S.upcoming.find(x=>x.id===r.id); if(u) u.nota=nota;
      toast(t("noteSaved")); noteFor=null; const keep=sheetDay; mainView(); sheetDay=keep; renderSheet(); }
    catch(err){ b.disabled=false; toast(t("saveErr")); }
  };
}
async function toggle(d,k){
  const s=S.blocks.get(d)||new Map(), r=s.get(k), on=!!r, l=encodeURIComponent(S.cur);
  if(on && r.nota && noteLine(r.nota) && !confirm(t("confirmFree"))) return;
  renderSheet(k);
  try{
    if(on){ await db(`bloqueios?id=eq.${r.id}`,{method:"DELETE"}); s.delete(k); S.upcoming = S.upcoming.filter(x=>x.id!==r.id); }
    else{
      let got = await db("bloqueios?select=id,data,horario",{method:"POST", body:{lancha:S.cur, data:d, horario:k}, prefer:"resolution=ignore-duplicates,return=representation"});
      if(!got?.length) got = await db(`bloqueios?select=id,data,horario&lancha=eq.${l}&data=eq.${d}&horario=eq.${k}`); /* já estava marcado (outro aparelho) */
      const row=rowOf(got[0]); if(!S.blocks.has(d)) S.blocks.set(d,s); s.set(k,row);
      if(d>=todayISO()) S.upcoming = [...S.upcoming.filter(x=>x.id!==row.id), row].sort((x,z)=>x.data<z.data?-1:x.data>z.data?1:SLOT_ORDER[x.horario]-SLOT_ORDER[z.horario]);
    }
    toast(on?t("freed"):t("saved"));
  }catch(e){ toast(t("saveErr")); }
  const keep=sheetDay; mainView(); sheetDay=keep;
  if(sheetDay===d) renderSheet();
}

/* ===== início: confere o login, descobre as lanchas do dono e abre a agenda ===== */
async function boot(){
  app.innerHTML = `<p class="loading">…</p>`;
  try{
    if(!ses.user) ses.user = await authCall("user",null,"GET",await fresh());
    saveSes(ses);
    const [admin, all, mine] = await Promise.all([db("rpc/e_admin",{method:"POST",body:{}}), db("lanchas?select=slug,nome&order=nome"), db(`donos?select=lancha&user_id=eq.${ses.user.id}`)]);
    S.admin = admin===true; S.all = all;
    S.boats = S.admin ? all : all.filter(b=>mine.some(m=>m.lancha===b.slug));
    if(S.admin) S.owners = await db("rpc/lista_donos",{method:"POST",body:{}});
    const saved = store.get("dono-boat");
    S.cur = S.boats.some(b=>b.slug===saved) ? saved : S.boats[0]?.slug || null;
    view = "main";
    await loadBlocks();
  }catch(e){
    if(!ses) return show();
    app.innerHTML = `<div class="card"><p class="msg err">${t("loadErr")}</p><button class="btn" id="retry">${t("retry")}</button></div>`;
    document.getElementById("retry").onclick = boot;
  }
}

let deferredInstall = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall=e; if(view==="main" && !sheetDay) mainView(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("/dono/sw.js",{scope:"/dono/"}).catch(()=>{});
document.documentElement.lang = lang==="pt"?"pt-BR":lang;

/* links que chegam por e-mail (senha nova, confirmação) trazem o login no endereço */
(function(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get("error_description")){ loginErr=true; loginMsg=t("linkErr"); history.replaceState(null,"",location.pathname); return show(); }
  if(h.get("access_token")){
    saveSes({access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_at:+h.get("expires_at")||0, expires_in:h.get("expires_in"), user:null});
    history.replaceState(null,"",location.pathname);
    if(h.get("type")==="recovery"){ view="newpw"; return show(); }
  }
  if(ses){ view="main"; boot(); } else show();
})();
