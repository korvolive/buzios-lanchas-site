<script>
(function(){
  var IOS_URL = "https://apps.apple.com/app/id6831398340";

  var ua = navigator.userAgent || "";
  var dentroApp = /BuziosLanchasIOS/.test(ua) || /^android-app:/.test(document.referrer || "");
  try { if (sessionStorage.getItem("twa")) dentroApp = true; } catch(e) {}
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  window.__APP = { ios: IOS_URL, android: AND_URL };
  if (/[?&]ficar=1/.test(location.search)) return;
  if (dentroApp) { location.replace("/"); return; }
  if (ios) { location.replace(IOS_URL); return; }
  if (android) { location.replace(AND_URL); return; }
})();
</script>
<style>
:root{--bg:#f3f7f8;--surface:#fff;--ink:#0c2430;--muted:#55707b;--line:#d6e2e6;--sea:#0b5c73;--sea-deep:#06394a}
@media (prefers-color-scheme:dark){:root{--bg:#071a22;--surface:#0d2531;--ink:#e6f1f4;--muted:#9db6bf;--line:#1d3a47;--sea:#5fb3c9;--sea-deep:#0b5c73}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center}
.card img{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto 16px}
h1{font-size:1.45rem;line-height:1.25;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 16px;border-radius:14px;text-decoration:none;font-weight:600;font-size:1rem;margin-bottom:12px;background:var(--sea-deep);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:22px;height:22px;flex:none}
.site{display:inline-block;margin-top:12px;color:var(--sea);font-size:.95rem}
.langs{margin-top:20px;font-size:.85rem;color:var(--muted)}
.langs a{color:var(--muted);margin:0 6px}
.langs a.on{color:var(--ink);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="card">

      <span data-t="ios">Baixar na App Store (iPhone)</span>
    </a>
    <a class="btn" id="b-and" href="https://play.google.com/store/apps/details?id=br.com.lanchaembuzios.app&amp;referrer=utm_source%3Dlink-app">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7L3.6 2.3zm10.8 10.8 2.6 2.6-11.8 6.8 9.2-9.4zm0-2.2L5.2 1.5 17 8.3l-2.6 2.6zm3.9-1.8 3 1.7c.9.5.9 1.9 0 2.4l-3 1.7-2.8-2.9 2.8-2.9z"/></svg>

  </div>
</main>
<script>
(function(){
  var T = {
    pt: {titulo:"Baixe o app da Búzios Lanchas", sub:"Escolha a loja do seu celular.", ios:"Baixar na App Store (iPhone)", android:"Baixar no Google Play (Android)", site:"Ou continuar no site", doc:"Baixar o app Búzios Lanchas", html:"pt-BR"},
    en: {titulo:"Get the Búzios Lanchas app", sub:"Choose your phone's store.", ios:"Download on the App Store (iPhone)", android:"Get it on Google Play (Android)", site:"Or continue on the website", doc:"Get the Búzios Lanchas app", html:"en"},
    es: {titulo:"Descarga la app de Búzios Lanchas", sub:"Elige la tienda de tu celular.", ios:"Descargar en App Store (iPhone)", android:"Descargar en Google Play (Android)", site:"O seguir en el sitio web", doc:"Descarga la app de Búzios Lanchas", html:"es"}
  };
  var m = location.search.match(/[?&]lang=(pt|en|es)/);
  var l = m ? m[1] : (navigator.language || "pt").slice(0,2).toLowerCase();
  if (!T[l]) l = "pt";
  var t = T[l];
  document.documentElement.lang = t.html;
  document.title = t.doc;
  var els = document.querySelectorAll("[data-t]");
  for (var i = 0; i < els.length; i++) { var k = els[i].getAttribute("data-t"); if (t[k]) els[i].textContent = t[k]; }
  var ls = document.querySelectorAll("[data-l]");
  for (var j = 0; j < ls.length; j++) if (ls[j].getAttribute("data-l") === l) ls[j].className = "on";
  var s = document.querySelector(".site"); if (s && l !== "pt") s.href = "/" + l + "/";
})();
</script>

</html>
