const MAIL_OK = ["gmail.com","hotmail.com","hotmail.com.br","outlook.com","outlook.com.br","live.com","msn.com","yahoo.com","yahoo.com.br","ymail.com","icloud.com","me.com","mac.com","uol.com.br","uol.com","bol.com.br","terra.com.br","ig.com.br","globo.com","globomail.com","aol.com","gmx.com","mail.com","proton.me","protonmail.com","zoho.com"];
const editDist = (a,b) => { const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const q=d[j]; d[j]=Math.min(d[j]+1, d[j-1]+1, p+(a[i-1]===b[j-1]?0:1)); p=q; } } return d[b.length]; };
function mailFix(e){
  const m=String(e||"").trim().toLowerCase().match(/^([^@\s]+)@([^@\s]+)$/); if(!m) return "";
  const dom=m[2].replace(/\.+$/,""); if(MAIL_OK.includes(dom)) return "";
  if(dom==="gmail.com.br") return m[1]+"@gmail.com";
  let best="", bd=9; for(const k of MAIL_OK){ const x=editDist(dom,k); if(x<bd){ bd=x; best=k; } }
  return bd && bd<=(dom.length>=8?2:1) ? m[1]+"@"+best : "";
}

/* ===== login: a sessão fica guardada no celular e é renovada sozinha ===== */
let ses = store.get("dono-ses");
const saveSes = s => { ses = s ? {access_token:s.access_token, refresh_token:s.refresh_token,
  expires_at: s.expires_at || Math.floor(Date.now()/1000) + (+s.expires_in||3600), user:s.user || ses?.user} : null; store.set("dono-ses",ses); };
async function authCall(path, body, method="POST", token){
  const r = await fetch(SB+"/auth/v1/"+path, {method, headers:{apikey:KEY, "content-type":"application/json", ...(token?{authorization:"Bearer "+token}:{})}, body: body && JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.msg||j.error_description||j.message||r.status), {code:j.error_code||j.error||"", status:r.status});
  return j;
}
let refreshing = null;
/* o login fica guardado no aparelho e não pode cair sozinho (Rodrigo 2026-10-25). Cada renovação troca o refresh_token e invalida o
   anterior; com o site, o app e o chat abertos juntos, um deles tentava renovar com um token já trocado pelo outro e o app saía da conta.
   Agora: renova um de cada vez entre as abas (navigator.locks), relê o login guardado antes e depois de renovar, e só sai da conta quando
   o servidor diz que o login acabou de verdade (saiu do aparelho, senha trocada, conta apagada). */
const sesStored = () => store.get("dono-ses");
const sesLock = fn => navigator.locks?.request ? navigator.locks.request("dono-ses-renova", fn) : fn();
const SES_FIM = /refresh_token_not_found|session_not_found|session_expired|user_not_found|user_banned/i;
window.addEventListener("storage", e=>{ if(e.key==="dono-ses" && ses){ const s=sesStored(); if(s?.refresh_token) ses=s; } });
async function fresh(force){
  if(!ses) throw new Error("sem sessão");
  if(!force && ses.expires_at - Date.now()/1000 > 60) return ses.access_token;
  const usado = ses.refresh_token;
  refreshing ||= sesLock(async()=>{
    const g = sesStored(); /* outra aba (site, chat) já renovou: usa o login novo em vez de gastar o antigo */
    if(g?.refresh_token && g.refresh_token!==usado && g.expires_at - Date.now()/1000 > 60){ ses={...g, user:g.user||ses?.user}; return ses.access_token; }
    if(!ses) throw new Error("sem sessão");
    try{ saveSes(await authCall("token?grant_type=refresh_token", {refresh_token:(g?.refresh_token)||ses.refresh_token})); return ses.access_token; }
    catch(e){
      const g2 = sesStored(); /* renovado em outra aba enquanto este pedido ia: segue com ele */
      if(g2?.refresh_token && g2.refresh_token!==usado && g2.refresh_token!==g?.refresh_token){ ses={...g2, user:g2.user||ses?.user}; return ses.access_token; }
      if(e.status>=400 && e.status<500 && SES_FIM.test(e.code+" "+e.message)){ saveSes(null); show(); }
      throw e;
    }
  }).finally(()=>refreshing=null);
  return refreshing;
}
/* chamada ao banco já com o login; se a sessão venceu, renova e tenta mais uma vez */
async function db(path, {method="GET", body, prefer}={}, retry=true){
  const tok = await fresh();
  const r = await fetch(SB+"/rest/v1/"+path, {method, headers:{apikey:KEY, authorization:"Bearer "+tok, "content-type":"application/json", ...(prefer?{prefer}:{})}, body: body && JSON.stringify(body)});
  if(r.status===401 && retry){ await fresh(true); return db(path,{method,body,prefer},false); }
  const txt = await r.text(); const j = txt ? JSON.parse(txt) : null;
  if(!r.ok) throw Object.assign(new Error(j?.message||r.status), {status:r.status, code:j?.code});
  return j;
}

/* CPF válido: confere os dois dígitos verificadores (o banco confere de novo) */
function cpfOk(c){
  if(!/^\d{11}$/.test(c) || /^(\d)\1{10}$/.test(c)) return false;
  const dv = n => { let s=0; for(let i=0;i<n;i++) s += +c[i]*(n+1-i); const r=(s*10)%11; return r===10?0:r; };
  return dv(9)===+c[9] && dv(10)===+c[10];
}
const fmtCPF = v => { const d=String(v||"").replace(/\D/g,"").slice(0,11); return d.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/,".$1-$2"); };
const profileFields = (v={}, nasc=false) => { /* CPF e data de nascimento só em Meus dados, opcionais (Rodrigo 2026-10-23: cadastro mais curto) */ const ph=splitPhone(v.whatsapp);
  return `<label class="f"><span>${t("fullName")}${REQ}</span><input type="text" id="c-nome" autocomplete="name" autocapitalize="words" placeholder="${t("ph_fullName")}" value="${esc(v.nome||"")}"></label>
    ${nasc ? `<label class="f" id="cpfbox"${ph.cc==="55"||PT_DEV?"":" hidden"}><span>${t("cpf")} <small class="muted" style="font-weight:400">(${t("ajOpt")})</small></span><input type="text" id="c-cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" value="${esc(fmtCPF(v.cpf))}"></label>` : ""}
    <div class="f"><label for="c-tel"><span>${t("whats")}${REQ}</span></label><div class="phone"><select class="in" id="c-ddi" aria-label="${t("country")}">${countryOpts(ph.cc)}</select><input type="tel" id="c-tel" inputmode="tel" autocomplete="tel-national" placeholder="${ph.cc==="55"?t("ph_phone"):""}" value="${esc(ph.num)}"></div></div>
    ${nasc ? nascField(v.nascimento) : ""}`; };
/* data de nascimento do cliente (Rodrigo: para chamar a pessoa para comemorar o aniversário na lancha) */
const nascField = (v="") => `<label class="f"><span>${t("nasc")} <small class="muted" style="font-weight:400">(${t("ajOpt")})</small></span><input type="date" id="c-nasc" min="1900-01-01" max="${todayISO()}" autocomplete="bday" value="${esc(v||"")}"></label>`;
const nascOk = d => /^\d{4}-\d{2}-\d{2}$/.test(d) && d>="1900-01-01" && d<=todayISO();
const idade = d => { if(!d) return null; const n=new Date(), b=dateOf(d); let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--; return a; };
const fmtNasc = d => dateOf(d).toLocaleDateString(t("locale"),{day:"numeric",month:"short"}).replace(/\./g,"");
function bindProfile(){
  const cpf=document.getElementById("c-cpf"), ddi=document.getElementById("c-ddi"), tel=document.getElementById("c-tel");
  if(cpf) cpf.oninput=()=>{ const end=cpf.selectionStart===cpf.value.length; cpf.value=fmtCPF(cpf.value); if(end) cpf.selectionStart=cpf.selectionEnd=cpf.value.length; };
  ddi.onchange=()=>{ const cb=document.getElementById("cpfbox"); if(cb) cb.hidden = ddi.value!=="55" && !PT_DEV; /* CPF só para brasileiros, e opcional */ tel.placeholder = ddi.value==="55" ? t("ph_phone") : ""; tel.value = ddi.value==="55" ? fmtBR(tel.value) : tel.value; };
  tel.oninput=()=>{ if(ddi.value==="55"){ const end=tel.selectionStart===tel.value.length; tel.value=fmtBR(tel.value); if(end) tel.selectionStart=tel.selectionEnd=tel.value.length; } };

/* lê e confere os dados; marca em vermelho o que falta e devolve a mensagem de erro */
function readProfile(){
  const v=id=>document.getElementById(id).value.trim(), miss=[], msgs=[];
  const nome=v("c-nome").replace(/\s+/g," "), cb=document.getElementById("c-cpf"), cpf=cb ? cb.value.replace(/\D/g,"") : "", cc=v("c-ddi"), tel=v("c-tel"), d=tel.replace(/\D/g,"");
  if(nome.length<5 || !nome.includes(" ")){ miss.push("c-nome"); msgs.push(t("nameBad")); }
  if((cc==="55"||PT_DEV) && cpf && !cpfOk(cpf)){ miss.push("c-cpf"); msgs.push(t("cpfBad")); } /* CPF opcional; estrangeiro não informa */
  if(!okPhone(cc,d)){ miss.push("c-tel"); msgs.push(t("myPhoneBad")); }
  const nb=document.getElementById("c-nasc"), nascimento = nb ? nb.value.trim() || null : undefined;
  if(nascimento && !nascOk(nascimento)){ miss.push("c-nasc"); msgs.push(t("nascBad")); }
  miss.forEach(id=>document.getElementById(id).classList.add("miss"));
  return {miss, msg:msgs.join("<br>"), data:{nome, ...(cb ? {cpf:(cc==="55"||PT_DEV) && cpf ? cpf : null} : {}), whatsapp:`+${cc} ${tel}`, ...(nascimento===undefined ? {} : {nascimento})}};
}

/* lanchas da própria Búzios Lanchas: o dono cadastrado não recebe parte nenhuma (Rodrigo 2026-10-25); igual na função asaas */
const SEM_REPASSE = ["miss-bardot"];
function repHTML(p, c, sin){
  if(!c.tot || !c.net || !(sin>0)) return "";
  const resto=c.tot-sin, mb=SEM_REPASSE.includes(p.lancha), dono=c.net-resto, bz=mb ? c.tot-(c.vd||0) : c.com ?? (c.tot-(c.vd||0)-c.net);
  return `<span class="repbox"><b>${t("repT")}</b>
    <span>${t("repSin",{v:brl(sin)})}</span>
    <span>${mb ? t("repProp") : (a=>a?.wallet_id && +a.repasse>0 ? t("repDonoAs",{v:brl(+a.repasse)}) : (dono>=0 ? t("repDono",{v:brl(dono)}) : t("repDonoNeg",{v:brl(-dono)})) + (a && dono>0 ? " "+t("repFora") : ""))(S.asPg?.[p.id])}</span>
    ${c.vd?`<span>${t("repVend",{v:brl(c.vd)})}</span>`:""}
    <span>${t("repBz",{v:brl(bz)})}</span>
    <span>${t("repResto",{v:brl(resto)})}</span></span>`;
}
/* depois de liberar: o mesmo Pix do chat, pronto para mandar no WhatsApp do cliente, no idioma dele */
function pixWa(p){
  const ph=splitPhone(p.clientes?.whatsapp), cc=String(ph.cc||"55").replace(/\D/g,""), tel=ph.num.replace(/\D/g,""); if(tel.length<8 || !(+p.sinal_valor>0)) return "";
  const lg = cc==="55" ? "pt" : COB_ES.has(cc) ? "es" : "en", M=COB_MSG[lg], c=pedCalc(p), v=+p.sinal_valor;
  const txt=M.msg({nome:(p.clientes?.nome||"").split(" ")[0], lancha:boatName(p.lancha), data:dateOf(p.data).toLocaleDateString(M.loc,{weekday:"long",day:"numeric",month:"long"}), horario:SLOT_TXT[lg][p.horario]||"", v:brl(v), resto:c.tot>v?brl(c.tot-v):"", pix:pixPayload(PIX_CNPJ, v, "PED"+p.id)});
  return `<a class="btn wa" href="https://wa.me/${cc}${tel}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${WA_ICON} ${t("pixWa")}</a>`;

/* cliente estrangeiro (WhatsApp fora do +55): cobrança do PayPal dentro do site (/pagar/), na moeda dele, com o câmbio do dia + 10% (editável).

const ppPaid = p => (S.ppPay||{})[p.id]?.pago_em;

function ppAdm(p){

  const field = pix ? "" : `<label class="f"><span>💳 ${t("ppVal",{c:COB_SYM[c]})}</span><span class="pkey"><input type="number" class="in" inputmode="decimal" min="1" step="any" data-ppv="${p.id}" data-cur="${c}" placeholder="${COB_SYM[c]}"${pg?` value="${+pg.valor}"`:""}><button type="button" class="btn${pg?" sec":""}" data-ppg="${p.id}">${t(pg?"save":"ppGen")}</button></span></label>`;

  const txt=CENTRAL_MSG[lg]({nome:(p.clientes?.nome||"").split(" ")[0], lancha:boatName(p.lancha), data:dateOf(p.data).toLocaleDateString(M.loc,{weekday:"long",day:"numeric",month:"long"}), horario:SLOT_TXT[lg][p.horario]||"", v:pix?brl(v):`${p.paypal_valor||""} (${brl(v)})`, link:p.paypal_link, resto:k.tot>v?brl(k.tot-v):""});
  return `<span class="ppbox"><small class="cpok">🧾 ${t(pix?"ctMadePix":"ppMade",{v:esc(p.paypal_valor||"")})}</small>
    ${tel.length>=8?`<a class="btn wa" href="https://wa.me/${cc}${tel}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${WA_ICON} ${t("ctWa")}</a>`:""}

/* cria ou muda a cobrança do PayPal (e manda o e-mail ao cliente só na primeira vez) */
async function ppLink(p, fx, cur){
  const r=await fetch(FN.replace(/notificar$/,"paypal-checkout"), {method:"POST", headers:{apikey:KEY, authorization:"Bearer "+await fresh(), "content-type":"application/json"},
    body:JSON.stringify({acao:"link", pid:p.id, valor:fx, moeda:cur, email:!(S.ppPay||{})[p.id]})});
  const j=await r.json().catch(()=>({})); if(!(r.ok && j.link)) throw new Error(j.erro||"falhou");
  p.paypal_link=j.link; p.paypal_valor=j.texto; (S.ppPay ||= {})[p.id]={pedido:p.id, moeda:cur, valor:fx};
  return j;
}
async function ppAuto(p){ /* ao liberar: cria a central (Pix em reais; estrangeiro sem vendedor: PayPal no câmbio do dia + 10%) e manda o e-mail */
  try{ let j;
    if(ppPix(p)) j=await ppLink(p, +p.sinal_valor, "BRL");
    else { const c=cobCur(ppCC(p)), R=await fxRates(); j=await ppLink(p, niceUp(+p.sinal_valor*R[c.toLowerCase()]*FX_MARKUP), c); }
    toast(t(j.email?"ctSentMail":ppPix(p)?"ctMadeT":"ppMadeT")); }catch(e){ toast(t("cobPpGenErr")); }
}

  const c=pedCalc(p), sug = p.sinal_valor ?? (c.tot ? Math.round(c.tot/2) : ""), lib=p.sinal_liberado_em, dd=x=>new Date(x).toLocaleDateString(t("locale"),{day:"2-digit",month:"2-digit"});

    ${lib?`<small class="cpok">${t("sinLibEm",{d:dd(lib)})}</small>${ppAdm(p)}`:""}
    ${repHTML(p, c, +sug||0)}

    <label class="btn sec cpup">📎 ${t("cpAttach")}<input type="file" accept="image/*,application/pdf" data-cpa="${p.id}" hidden></label></span>`;

const cpExt = f => f.type==="application/pdf" ? "pdf" : (f.type.split("/")[1]||"jpg").replace("jpeg","jpg");
async function cpStore(path, file){ /* comprovantes/<pasta>/<arquivo>: cliente na própria pasta; o administrador em qualquer uma */
  const r=await fetch(`${SB}/storage/v1/object/comprovantes/${path}`,{method:"POST", headers:{apikey:KEY, authorization:"Bearer "+await fresh(), "content-type":file.type||"application/octet-stream"}, body:file});
  if(!r.ok) throw new Error(r.status);
}
async function cpUpload(pid, file){
  if(!file) return; if(file.size>5*1024*1024){ toast(t("cpBig")); return; }
  const path=`${ses.user.id}/${pid}-${Date.now()}.${cpExt(file)}`;
  toast(t("cpSending"));
  try{ await cpStore(path, file);
    await db("rpc/enviar_comprovante",{method:"POST", body:{pid, caminho:path}});
    fetch(FN.replace(/notificar$/,"aviso-comprovante"),{method:"POST", headers:{apikey:KEY, authorization:"Bearer "+await fresh(), "content-type":"application/json"}, body:JSON.stringify({id:pid})}).catch(()=>{});
    toast(t("cpOk")); await loadMyReq(); clientView(); }
  catch(e){ toast(t("cpErr")); }
}
/* o administrador anexa o comprovante que o cliente mandou pelo WhatsApp */
async function cpAdmPedido(pid, file){
  const p=S.reqs.find(p=>p.id===pid); if(!p || !file) return; if(file.size>5*1024*1024){ toast(t("cpBig")); return; }
  const path=`${p.cliente}/${pid}-${Date.now()}.${cpExt(file)}`; toast(t("cpSending"));
  try{ await cpStore(path, file); const now=new Date().toISOString();
    await db(`pedidos?id=eq.${pid}`,{method:"PATCH",body:{comprovante:path, comprovante_em:now, atualizado_em:now}});
    toast(t("cpOk")); await loadReqs(); mainView(); }
  catch(e){ toast(t("cpErr")); }
}
async function cpList(bid){ /* comprovantes dos passeios lançados na agenda: pasta "passeios", arquivos <id do passeio>-<hora> */
  const r=await fetch(`${SB}/storage/v1/object/list/comprovantes`,{method:"POST", headers:{apikey:KEY, authorization:"Bearer "+await fresh(), "content-type":"application/json"}, body:JSON.stringify({prefix:"passeios", search:`${bid}-`, limit:20, sortBy:{column:"name",order:"desc"}})});
  if(!r.ok) return []; return (await r.json()).filter(f=>f.name.startsWith(`${bid}-`)).map(f=>({path:"passeios/"+f.name, em:+f.name.split("-")[1].split(".")[0]}));
}
async function cpOpen(path){
  const w=window.open("", "_blank");
  try{ const r=await fetch(`${SB}/storage/v1/object/sign/comprovantes/${path}`,{method:"POST", headers:{apikey:KEY, authorization:"Bearer "+await fresh(), "content-type":"application/json"}, body:JSON.stringify({expiresIn:600})});
    const j=await r.json(); if(!r.ok || !j.signedURL) throw 0; const u=SB+"/storage/v1"+j.signedURL; if(w) w.location=u; else location.href=u; }
  catch(e){ if(w) w.close(); toast(t("loadErr")); }
}

const avMiss = new Set();
function avErr(img){ const u=/avatares\/([^.]+)\.jpg/.exec(img.src)?.[1]; if(u) avMiss.add(u); const a=img.dataset.alt; if(a){ img.removeAttribute("data-alt"); img.src=a; return; } const s=img.parentNode; s.classList.add("ini"); s.textContent=s.dataset.ini; }
const loadImg = src => new Promise((ok,no)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>ok(im); im.onerror=no; im.src=src; });
/* recorta o quadrado {x,y,s} (sem ele, o meio) e reduz para 320px (a foto do celular vira uns 30 KB) */
async function squareJpeg(src, r){ const im=typeof src==="string" ? await loadImg(src) : src, w=im.naturalWidth, h=im.naturalHeight;
  r ||= {x:(w-Math.min(w,h))/2, y:(h-Math.min(w,h))/2, s:Math.min(w,h)};
  const c=document.createElement("canvas"); c.width=c.height=320; c.getContext("2d").drawImage(im,r.x,r.y,r.s,r.s,0,0,320,320);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("blob")),"image/jpeg",.85)); }
/* acha o rosto na foto: primeiro o detector do próprio navegador; senão o MediaPipe (só baixa quando a pessoa escolhe uma foto) */
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
let mpDet = null;
async function findFace(im){
  const W=im.naturalWidth, H=im.naturalHeight, big = bs => bs.sort((a,b)=>b.width*b.height-a.width*a.height)[0];
  try{ if("FaceDetector" in window){ const f=await new FaceDetector({fastMode:false,maxDetectedFaces:5}).detect(im); if(f.length) return big(f.map(x=>x.boundingBox)); } }catch(e){}
  try{
    mpDet ||= import(MP+"/vision_bundle.mjs").then(async v=>v.FaceDetector.createFromOptions(await v.FilesetResolver.forVisionTasks(MP+"/wasm"),
      {baseOptions:{modelAssetPath:"/login/rosto.tflite"}, runningMode:"IMAGE", minDetectionConfidence:.5}));
    const d = await mpDet;
    /* a foto inteira e, na foto em pé, o quadrado de cima (rosto pequeno em foto de corpo inteiro) */
    const regs=[{x:0,y:0,w:W,h:H}]; if(H>W*1.15) regs.push({x:0,y:0,w:W,h:W});
    for(const g of regs){ const k=Math.min(1,640/Math.max(g.w,g.h)), c=document.createElement("canvas"); c.width=Math.round(g.w*k); c.height=Math.round(g.h*k);
      c.getContext("2d").drawImage(im,g.x,g.y,g.w,g.h,0,0,c.width,c.height);
      const r=d.detect(c).detections.map(x=>x.boundingBox).map(b=>({x:g.x+b.originX/k, y:g.y+b.originY/k, width:b.width/k, height:b.height/k}));
      if(r.length) return big(r); }
  }catch(e){ mpDet=null; }
  return null;
}
/* quadrado com o rosto no meio (um pouco de ombro); sem rosto, foto em pé corta mais em cima, onde costuma estar a cabeça */
function faceCrop(W, H, f){
  const m=Math.min(W,H), cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  if(!f) return {x:(W-m)/2, y:H>W ? (H-m)*.12 : (H-m)/2, s:m};
  const s=cl(Math.max(f.width,f.height)*2.1, Math.min(m,160), m);
  return {x:cl(f.x+f.width/2-s/2,0,W-s), y:cl(f.y+f.height*.55-s/2,0,H-s), s};
}

async function openCrop(url, uid){ /* uid: foto de outra pessoa (página Usuários) */
  const other = uid && uid!==ses.user.id;
  sheet.innerHTML = `<div class="grab"></div><button type="button" class="shx" aria-label="${t("close")}">✕</button><h2 style="text-align:center">${t("avAdjT")}</h2><p class="muted" style="margin-top:0;text-align:center" id="cropmsg">${t("avFinding")}</p>
    <div class="crop" id="crop"><img id="cropimg" alt="" draggable="false"></div>
    <label class="f cropz"><span>${t("avZoom")}</span><input type="range" id="cropz" min="1" max="4" step="0.01" value="1" disabled></label>
    <button type="button" class="btn" id="cropok" disabled>${t("avSave")}</button>
    <button type="button" class="btn sec" id="cropx" style="margin-top:10px">${t("pwCancel")}</button>`;
  sheet.classList.add("on"); sheetBg.classList.add("on");
  const end = () => URL.revokeObjectURL(url);
  document.getElementById("cropx").onclick = () => { end(); other ? openUser(uid) : openFace(); };
  let im; try{ im=await loadImg(url); }catch(e){ end(); closeDay(); return toast(t("avErr")); }
  const W=im.naturalWidth, H=im.naturalHeight, m=Math.min(W,H), box=document.getElementById("crop"), img=document.getElementById("cropimg"), z=document.getElementById("cropz");
  img.src=url;
  const f = await findFace(im); if(!document.getElementById("crop")) return end();
  let r = faceCrop(W,H,f);
  document.getElementById("cropmsg").textContent = t("avAdjSub");
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v)), V=()=>box.clientWidth;
  const draw = () => { r.s=cl(r.s,m/4,m); r.x=cl(r.x,0,W-r.s); r.y=cl(r.y,0,H-r.s); const k=V()/r.s;
    img.style.width=W*k+"px"; img.style.height=H*k+"px"; img.style.transform=`translate(${-r.x*k}px,${-r.y*k}px)`; z.value=m/r.s; };
  draw(); z.disabled=false; document.getElementById("cropok").disabled=false;
  z.oninput = () => { const c={x:r.x+r.s/2, y:r.y+r.s/2}; r.s=m/+z.value; r.x=c.x-r.s/2; r.y=c.y-r.s/2; draw(); };
  let p=null;
  box.onpointerdown = e => { p={x:e.clientX, y:e.clientY}; box.setPointerCapture(e.pointerId); };
  box.onpointermove = e => { if(!p) return; const k=V()/r.s; r.x-=(e.clientX-p.x)/k; r.y-=(e.clientY-p.y)/k; p={x:e.clientX, y:e.clientY}; draw(); };
  box.onpointerup = box.onpointercancel = () => p=null;
  box.onwheel = e => { e.preventDefault(); z.value=cl(+z.value*(e.deltaY<0?1.08:1/1.08),1,4); z.oninput(); };
  document.getElementById("cropok").onclick = async () => { sheet.querySelectorAll("button,input").forEach(b=>b.disabled=true); toast(t("avSaving"));
    try{ await avUpload(im, {...r}, uid); toast(t("avSaved")); if(other) await afterUser(uid); else { closeDay(); refreshTop(); } }catch(e){ closeDay(); avFail(e); } finally{ end(); } };
}

/* capa: precisa mostrar a lancha inteira (detector de objetos no aparelho, modelo /login/lancha.tflite).
   Se a lancha couber no recorte 4:3 do card do site, devolve o enquadramento (p) que centraliza a lancha. */
let boatDet = null;
async function capaCheck(f){
  boatDet ||= import(MP+"/vision_bundle.mjs").then(async v=>v.ObjectDetector.createFromOptions(await v.FilesetResolver.forVisionTasks(MP+"/wasm"),
    {baseOptions:{modelAssetPath:"/login/lancha.tflite"}, runningMode:"IMAGE", scoreThreshold:.3, maxResults:5, categoryAllowlist:["boat"]}));
  let d, im;
  try{ d=await boatDet; im=new Image(); im.crossOrigin="anonymous"; im.src=phUrl(f); await im.decode(); }
  catch(e){ boatDet=null; return {ok:false, why:"phWhyErr"}; }
  const W=im.naturalWidth, H=im.naturalHeight;
  const bs=d.detect(im).detections.filter(x=>x.categories[0].score>=.6).map(x=>x.boundingBox).sort((a,b)=>b.width*b.height-a.width*a.height);
  if(!bs.length) return {ok:false, why:"phWhyNone"};
  const b=bs[0], x0=b.originX/W, y0=b.originY/H, x1=(b.originX+b.width)/W, y1=(b.originY+b.height)/H;
  if(x0<.015 || y0<.01 || x1>.985 || y1>.99) return {ok:false, why:"phWhyCut"};
  if(x1-x0<.35) return {ok:false, why:"phWhySmall"};
  const a=W/H, vw=Math.min(1,(4/3)/a), vh=Math.min(1,a/(4/3)); /* parte da foto que aparece no card 4:3 */
  if(x1-x0>vw*.98 || y1-y0>vh*.98) return {ok:false, why:"phWhyCut"};
  const pos=(c,v)=> v>=.999 ? 50 : Math.round(Math.max(0,Math.min(1,(c-v/2)/(1-v)))*100);
  return {ok:true, p:`${pos((x0+x1)/2,vw)}% ${pos((y0+y1)/2,vh)}%`};
}

/* redimensiona no aparelho para o padrão da galeria do site: até 1400 px no lado maior (JPEG) e miniatura de 360 px de altura */
async function fitJpeg(file, maxW, maxH, q){
  let src; try{ src=await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ src=new Image(); src.src=URL.createObjectURL(file); await src.decode(); }
  const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight, k=Math.min(1,maxW/w,maxH/h), c=document.createElement("canvas");
  c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("blob")),"image/jpeg",q));
}
async function phUpload(files){
  const l=S.cur, room=PH_MAX-(S.photos||[]).length-(S.pend||[]).length;
  if(room<=0) return toast(t("phMax",{max:PH_MAX}));
  if(files.length>room){ alert(t("phMaxSome",{n:room, max:PH_MAX})); files=files.slice(0,room); }
  const novas=[];
  for(let i=0;i<files.length;i++){
    toast(t("phSending",{n:i+1, t:files.length}));
    let big, small; try{ big=await fitJpeg(files[i],1400,1400,.82); small=await fitJpeg(files[i],640,360,.78); }catch(e){ toast(t("phBadFile")); continue; }
    const name=`${l}/${Date.now()}-${Math.random().toString(36).slice(2,7)}`, tk=await fresh();
    try{ for(const [suf,b] of [[".jpg",big],["-t.jpg",small]]){
        const r=await fetch(`${SB}/storage/v1/object/lanchas/${name}${suf}`,{method:"POST", headers:{apikey:KEY, authorization:"Bearer "+tk, "content-type":"image/jpeg", "cache-control":"max-age=31536000"}, body:b});
        if(!r.ok){ const j=await r.json().catch(()=>({})); throw Object.assign(new Error(j.message||r.status),{missing:/bucket/i.test(j.message||j.error||"")}); } }
      novas.push(phBase+name); }
    catch(e){ toast(e.missing && S.admin ? t("phNeedSql") : t("saveErr")); return; }
  }
  if(!novas.length) return;
  if(S.admin){ const L=S.photos||[], add=novas.map(f=>({f, p:"center 50%"}));

    if(await savePhotos(L.length>=2 ? [...L.slice(0,-1), ...add, L[L.length-1]] : [...L, ...add], l)) toast(t("phSentAdm")); }
  else{
    try{ await db("fotos_pendentes",{method:"POST", body:novas.map(f=>({lancha:l, f})), prefer:"return=minimal"}); }
    catch(e){ novas.forEach(phRmFiles); toast(e.status===403||e.code==="42501" ? t("phMax",{max:PH_MAX}) : t("saveErr")); return; }

}

const b64bytes = b => { const s=atob(b.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((b.length+3)%4)); return Uint8Array.from(s,c=>c.charCodeAt(0)); };
async function callFn(body){

/* inscreve este celular e grava no banco (passa para quem está logado se outra pessoa usou antes) */
async function pushSubscribe(){
  const reg = await navigator.serviceWorker.ready;

  if(!sub){ const {publica} = await callFn(); sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64bytes(publica)}); }

  return inLang(cl, ()=>{
    const donos = S.admin ? (S.owners||[]).filter(o=>o.lancha===row.lancha && o.nome).map(o=>`${o.nome}${o.telefone?` · WhatsApp ${o.telefone}`:""}`) : S.myProf ? [`${S.myProf}${S.myTel?` · WhatsApp ${S.myTel}`:""}`] : [];

}

/* agrupa por lancha: a que tem mais passeios fica no topo (empate: a do passeio mais próximo) */
const byBoat = rs => { const g=new Map(); rs.forEach(p=>{ if(!g.has(p.lancha)) g.set(p.lancha,[]); g.get(p.lancha).push(p); }); return [...g].sort((a,b)=>b[1].length-a[1].length); };
function pedidosHTML(){
  if(S.reqs===false) return `<div class="card"><p class="msg err" style="margin:0">${t("needSqlCli")}</p></div>`;
  if(!S.reqs) return "";
  /* Histórico = passeios que já aconteceram e foram confirmados; Cancelados = apagados, recusados, desistências, os que não aconteceram e pendentes que passaram da data */
  const f=S.reqF && S.reqF!=="chat" ? S.reqF : "pendente", today=todayISO(), feito=p=>(S.feitos||{})[p.bloqueio_id];
  const kind=p=> p.status==="pendente" ? (p.data>=today ? "pendente" : "canc") : p.status!=="aprovado" ? "canc" : feito(p)===true ? "hist" : feito(p)===false ? "canc" : "aprovado";
  /* passeio da agenda (já com sinal): depois de confirmado que aconteceu = histórico */
  const kindT=r=> S.feitos?.[r.id]===true ? "hist" : S.feitos?.[r.id]===false ? "canc" : "aprovado";
  const L={pendente:[], aprovado:[], hist:[], canc:[]}; S.reqs.forEach(p=>L[kind(p)].push(p)); (S.reqTrips||[]).forEach(r=>L[kindT(r)].push(r));
  L.pendente.sort(cmpRows); L.aprovado.sort(cmpRows); L.hist.sort((x,z)=>cmpRows(z,x)); L.canc.sort((x,z)=>cmpRows(z,x));
  const card = x => x.nota!==undefined ? tripCard(x,true) : reqCard(x,true);
  return `${confirmHTML()}${waAvHTML()}${f==="pendente" ? consHTML() : ""}<p class="how muted">${t("reqSub")}</p>
    <div class="tabs sub" role="tablist">${[["pendente","reqPend"],["aprovado","reqOk"],["hist","reqHist"],["canc","reqCanc"]].map(([k,l])=>`<button type="button" role="tab" data-rf="${k}" aria-selected="${f===k}">${t(l)} (${L[k].length})</button>`).join("")}</div>
    ${!L[f].length ? `<div class="card"><p class="muted" style="margin:0">${t("reqNone")}</p></div>`
      : f!=="pendente" ? byBoat(L[f]).map(([l,rs])=>`<details class="rqboat" data-rqb="${f}|${esc(l)}"${S.rqOpen?.has(f+"|"+l)?" open":""}><summary class="mhead"><h3 class="who">${avatar(l,"bav")}${esc(boatName(l))}</h3><span>${rs.length===1?t("monthHead1"):t("monthHead",{n:rs.length})}<i class="chev" aria-hidden="true">›</i></span></summary><div class="trips">${rs.map(card).join("")}</div></details>`).join("") /* cada lancha abre e fecha com um toque */
      : `<div class="trips">${L[f].map(card).join("")}</div>`}`;
}

/* ===== chat permanente (Rodrigo, 2026-10-22): uma conversa fixa do cliente com a Búzios Lanchas (atendimento), uma com cada

   a mensagem leva a marca "Sobre: lancha · data". Mensagens por função do banco (mensagens_da_v2); a tela aberta atualiza a cada 4 s. */
S.convs = null; S.chatUnread = 0; let chatTimer = null, chatCid = null, chatLast = 0, chatRows = [], chatTick = 0, chatRef = null, chatBusy = false;
async function loadConvs(){ try{ S.convs = await RPC("minhas_conversas_v4",{}); S.chatUnread = S.convs.reduce((a,c)=>a+(+c.nao_lidas||0),0); }catch(e){ if(S.convs==null) S.convs = (e.status===404||e.status===400) ? false : null; } }

/* tradução automática do chat (Rodrigo, 2026-10-22): mensagens das outras pessoas aparecem no idioma de quem lê, com "ver original";

const chTr = new Map(), chOrig = new Set(); let chTrBusy=false;

    const j=r.ok ? await r.json() : {}; ids.forEach(id=>chTr.set(id+"|"+lg, j[id]||null));

  catch(e){} chTrBusy=false;
}
const trOf = m => { if(!trOn() || !m.texto || m.autor===ses.user.id) return null; const x=chTr.get(trKey(m.id)); return x && x.de!==lang && x.t && x.t.trim()!==m.texto.trim() ? x : null; };

    ${!m.apagada && m.anexo ? attHTML(m) : (tr => `<div class="cht">${m.apagada?t("chDeleted"):esc(tr && !chOrig.has(m.id) ? tr.t : m.texto)}</div>${tr?`<button type="button" class="chtr" data-mtr="${m.id}">🌐 ${t(chOrig.has(m.id)?"chTrSee":"chTrOrig")}</button>`:""}`)(m.apagada?null:trOf(m))}

async function attShrink(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)) return f;
  try{ const im=await loadImg(URL.createObjectURL(f)), k=Math.min(1, 1600/Math.max(im.naturalWidth, im.naturalHeight)), cv=document.createElement("canvas");
    cv.width=Math.round(im.naturalWidth*k); cv.height=Math.round(im.naturalHeight*k); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)); return b && b.size<f.size ? new File([b], f.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : f; }catch(e){ return f; }
}
async function attUpload(cid, file){

  const ext = pdf ? "pdf" : (f.type.split("/")[1]||"jpg").replace("jpeg","jpg"), path=`${cid}/${ses.user.id}-${Date.now()}.${ext}`;

/* novo usuário: cria o login (se o e-mail ainda não tiver), grava nome e WhatsApp e já dá o acesso escolhido */
function openNewUser(){
  sheet.innerHTML = `<div class="grab"></div><button type="button" class="shx" aria-label="${t("close")}">✕</button><h2>+ ${t("userNew")}</h2><p class="muted" style="margin-top:0">${t("userNewSub")}</p>
    <form id="unf" class="nform" novalidate><div id="unmsg"></div>
      <label class="f"><span>${t("fullName")}</span><input type="text" id="unnm" autocapitalize="words" autocomplete="off" placeholder="${t("ph_fullName")}"></label>
      ${phoneField("un","WhatsApp","")}
      <label class="f"><span>E-mail</span><input type="email" id="unem" autocapitalize="off" inputmode="email" autocomplete="off"></label>
      <label class="f"><span>${t("userPwNew")} <small class="muted" style="font-weight:400">(${t("staffPwHint")})</small></span><input type="text" id="unpw" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
      <label class="f"><span>${t("userWhat")}</span><select class="in" id="unt">${roleOpts(false)}</select></label>
      <label class="f" id="unlw"><span>${t("boat")}</span><select class="in" id="unl">${boatOpts()}</select></label>
      <button class="btn" id="ungo">${t("userCreate")}</button></form>
    <button type="button" class="btn sec" id="unx" style="margin-top:10px">${t("pwCancel")}</button>`;
  sheet.classList.add("on"); sheetBg.classList.add("on"); bindPhone("un");
  document.getElementById("unx").onclick = closeDay;
  const tp=document.getElementById("unt"), lw=document.getElementById("unlw"), sync=()=>{ lw.style.display = tp.value==="free" ? "none" : ""; }; tp.onchange=sync; sync();
  document.getElementById("unf").onsubmit = async e => { e.preventDefault();
    const out=document.getElementById("unmsg"), b=document.getElementById("ungo"), nome=document.getElementById("unnm").value.trim(), ph=readPhone("un");
    const email=document.getElementById("unem").value.trim().toLowerCase(), pw=document.getElementById("unpw").value.trim(), k=tp.value, l=k==="free"?null:document.getElementById("unl").value;
    const fail = m => { out.innerHTML=`<p class="msg err">${m}</p>`; out.scrollIntoView({block:"center",behavior:"smooth"}); b.disabled=false; };
    if(!nomeOk(nome)) return fail(t("nameBad")); if(!ph.ok) return fail(t("userPhoneBad"));
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail(t("emailBad"));
    b.disabled=true;
    try{
      if(!S.users) await loadUsers();
      let u=S.users.find(x=>x.email.toLowerCase()===email), created=false, needConfirm=false;
      if(!u){ if(pw.length<6) return fail(t("needPw"));
        const nu=await authCall("signup",{email, password:pw}); needConfirm = !nu.access_token && !nu.session;
        await loadUsers(); u=S.users.find(x=>x.email.toLowerCase()===email); if(!u) return fail(t("notFound")); created=true; }
      await RPC("editar_usuario",{uid:u.user_id, nome_novo:nome, tel:ph.tel});
      u = {...u, nome, telefone:ph.tel};
      const r=await roleAdd(u,k,l); if(r && r!=="ok") throw new Error(r);
      const txt=t("waUserNew",{name:nome.split(" ")[0], role:t("role_"+k)+(l?" · "+boatName(l):""), url:location.origin+"/login/", email, pw:pw||"—"}), w=waOf(ph.tel);
      const m=`<p class="msg ok">${created?t("created")+" ":""}${t("userAdded",{name:esc(nome)})}</p>${needConfirm?`<p class="msg err">${t("confirmOn")}</p>`:""}
        ${pw?`<a class="btn wa" style="margin:0 0 12px" href="https://wa.me/${w.length>=8?w:""}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${WA_ICON} ${t("sendWa")}</a>`:""}`;
      S.userF="todos"; S.userQ="";
      if(k==="fixo"||k==="free"){ await reloadPeople(); mainView(); toast(t("userAdded",{name:nome})); return avisoEquipe({nome, email, tel:ph.tel, tipo:k==="free"?"freelancer":"fixo", lancha:l, pw: created ? pw : ""}); }
      await afterUser(u.user_id, m);
    }catch(x){ fail(x.status===422 ? t("emTaken") : errMsg(x)); } };
}

/* funcionário lê pela função do banco, que esconde os valores quando o dono não deixa ver */
async function fetchVis(de, ate, desc){

}
async function fetchRows(q){
  if(S.notes){ const withMar=S.marOk, withCc=S.ccOk, withEmb=S.embOk, withAj=S.ajOk, withHr=S.hrOk, withMn=S.mnOk; try{ return (await db(`bloqueios?select=id,lancha,data,horario,revenda,status_manual,${noteCols()}&${q}`)).map(rowOf); }
    catch(e){ if(e.status!==400 && e.status!==404) throw e;
      if(withMn){ S.mnOk=false; return fetchRows(q); } /* anotação do marinheiro ainda não criada */
      if(withHr){ S.hrOk=false; return fetchRows(q); } /* colunas do horário combinado ainda não criadas */
      if(withAj){ S.ajOk=false; return fetchRows(q); } /* coluna do ajudante ainda não criada */
      if(withEmb){ S.embOk=false; return fetchRows(q); } /* coluna do local de embarque ainda não criada */
      if(withCc){ S.ccOk=false; return fetchRows(q); } /* coluna da conta do cliente ainda não criada */
      if(withMar){ S.marOk=false; return fetchRows(q); } /* coluna do marinheiro ainda não criada: segue sem ela */
      S.notes=false; } } /* tabela de anotações ainda não criada */
  return (await db(`bloqueios?select=id,lancha,data,horario,revenda,status_manual&${q}`)).map(rowOf);
}
const SLOT_ORDER = {dia:0, manha:1, tarde:2, noite:3};

  if((S.admin || S.own?.length) && (S.tab==="pedidos" || S.tab==="lista")) await loadToConfirm(); /* recarrega: o passeio pode ter terminado com o app aberto */
  if(S.tab==="pedidos" && S.admin){ const my=++loadSeq; await loadReqs(); if(my===loadSeq) mainView(); return; }
  if(S.tab==="usuarios" && S.admin){ const my=++loadSeq; if(!S.users) mainView(); loadClis(); await Promise.all([loadUsers(), loadComPend(), loadLeads()]); if(my===loadSeq) mainView(); return; }

    if(S.admin && boatRow(l)?.dados) loadPub().then(()=>{ if(my===loadSeq && S.tab==="lancha") mainView(); });
    db("rpc/lista_visualizadores",{method:"POST",body:{}}).then(v=>{ S.staff=v; }, ()=>{ S.staff=null; }).then(()=>{ if(my===loadSeq && S.tab==="lancha") mainView(); });
    if(S.admin) db(`precos?select=*&lancha=eq.${encodeURIComponent(l)}`).then(r=>{ S.no7=false; return r; }, e=>{ if(e.status!==400) throw e; S.no7=true; /* colunas de 7 horas ainda não criadas */ return db(`precos?select=baixa,media,alta,pico,reveillon&lancha=eq.${encodeURIComponent(l)}`); })
      .then(r=>{ S.prices=r[0]||{}; }, e=>{ S.prices = (e.status===404||e.status===400) ? false : null; }).then(()=>{ if(my===loadSeq && S.tab==="lancha") mainView(); });
    S.neto=null; if(S.admin) db(`precos_neto?select=chave,neto,comissao,ref&lancha=eq.${encodeURIComponent(l)}`).catch(e=>{ if(e.status!==400) throw e; return db(`precos_neto?select=chave,neto,comissao&lancha=eq.${encodeURIComponent(l)}`); /* sem a coluna ref ainda */ }).then(r=>{ S.neto=Object.fromEntries(r.map(x=>[x.chave,x])); S.hasRef=r.some(x=>"ref" in x); }, e=>{ S.neto=false; /* tabela ainda não criada: editor antigo */ }).then(()=>{ if(my===loadSeq && S.tab==="lancha") mainView(); });
    S.photos=null; S.pend=[]; loadPhotos(l).then(()=>{ if(my===loadSeq && S.tab==="lancha") mainView(); });
    S.cupDono=undefined; if(S.admin || S.own?.includes(l)) db("rpc/lanchas_cupom_dono_v2",{method:"POST",body:{}}).then(r=>{ S.cupDono=r.find(x=>x.lancha===l)||null; } /* a tabela não tem leitura direta: a rpc devolve todas */, e=>{ S.cupDono=(e.status===404||e.status===400) ? false : undefined; }).then(()=>{ if(my===loadSeq && S.tab==="lancha") mainView(); });
    try{ const r=await db(`itens?select=opcionais&lancha=eq.${encodeURIComponent(l)}`); if(my!==loadSeq) return; S.items = r[0]?.opcionais || []; S.err=""; }
    catch(e){ if(my!==loadSeq || !ses) return; S.items = (e.status===404||e.status===400) ? false : null; if(S.items===null) S.err="load"; }
    return mainView(); }
  const my=++loadSeq, y=S.month.getFullYear(), mo=S.month.getMonth();
  if(isRO() && !S.marNames[S.cur]){ const l=S.cur; S.marNames[l]={};
    db("rpc/marinheiros_da_lancha",{method:"POST",body:{l}}).then(v=>{ v.forEach(m=>S.marNames[l][m.user_id]=m.nome); }, ()=>{}); }
  const a=iso(new Date(y,mo,1)), b=iso(new Date(y,mo+1,0)), all=S.cur==="*", lf = all ? "" : `lancha=eq.${encodeURIComponent(S.cur)}&`;

    const [rows, up, past] = ro ? await Promise.all([fetchVis(a,b), fetchVis(todayISO()), S.past ? fetchVis(p0,yest,true) : null]) : await Promise.all([

    S.upcoming = up.sort((x,z)=>x.data<z.data?-1:x.data>z.data?1:SLOT_ORDER[x.horario]-SLOT_ORDER[z.horario]); S.err="";
  }catch(e){ if(my!==loadSeq || !ses) return; S.err="load"; }
  mainView();
}

      if(!tripNew && !pending && !isPending(n) && nota.embarque && n.embarque && nota.embarque!==n.embarque){ callFn({tipo:"embarque", id:row.id}).catch(()=>{}); if(waOf(nota.telefone).length>=8){ closeDay(); loadBlocks(); return notifyEmb(row, nota); } }
      if(fromDay){ row.nota=nota; noteFor=null; await loadBlocks(); renderSheet(); } else { closeDay(); loadBlocks(); }

async function toggle(d,k){
  const s=S.blocks.get(d)||new Map(), r=s.get(k), on=!!r, l=encodeURIComponent(S.cur);
  if(on && r.nota && noteLine(r.nota) && !confirm(t("confirmFree"))) return;
  if(!on && mntOn(d) && !(await mntFree(S.cur,d))) return;
  renderSheet(k);
  try{
    if(on){ await db(`bloqueios?id=eq.${r.id}`,{method:"DELETE"}); s.delete(k); S.upcoming = S.upcoming.filter(x=>x.id!==r.id); }
    else{
      let got = await db("bloqueios?select=id,data,horario",{method:"POST", body:{lancha:S.cur, data:d, horario:k}, prefer:"resolution=ignore-duplicates,return=representation"});
      if(!got?.length) got = await db(`bloqueios?select=id,data,horario&lancha=eq.${l}&data=eq.${d}&horario=eq.${k}`); /* já estava marcado (outro aparelho) */
      const row=rowOf(got[0]); if(!S.blocks.has(d)) S.blocks.set(d,s); s.set(k,row);
      if(d>=todayISO()) S.upcoming = [...S.upcoming.filter(x=>x.id!==row.id), row].sort((x,z)=>x.data<z.data?-1:x.data>z.data?1:SLOT_ORDER[x.horario]-SLOT_ORDER[z.horario]);
    }
    toast(on?t("freed"):t("saved"));
  }catch(e){ toast(t("saveErr")); }
  const keep=sheetDay; mainView(); sheetDay=keep;
  if(sheetDay===d) renderSheet();
}

  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get("message") && !h.get("access_token")){ history.replaceState(null,"",location.pathname); setTimeout(()=>toast(t("emHalf")),600); }
  if(h.get("error_description")){ loginErr=true; loginMsg=/banned/i.test(h.get("error_description")+h.get("error_code")) ? t("blockedMsg") : t("linkErr"); history.replaceState(null,"",location.pathname); return show(); }
  if(h.get("access_token")){
    ses = null; /* login de outra pessoa pelo link (ex.: convite aberto no celular do administrador): não herda o usuário anterior */
    saveSes({access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_at:+h.get("expires_at")||0, expires_in:h.get("expires_in"), user:null});
    history.replaceState(null,"",location.pathname);
    if(h.get("type")==="recovery" || h.get("type")==="invite"){ view="newpw"; return show(); }
  }
  const qs=new URLSearchParams(location.search);
  if(/^[0-9a-f-]{36}$/i.test(qs.get("c")||"")) store.set("conv-c", qs.get("c")); /* convite pelo WhatsApp: o passeio entra na conta de quem abriu o link */
  if(qs.has("c")){ const q2=new URLSearchParams(location.search); q2.delete("c"); history.replaceState(null,"",location.pathname+(q2.toString()?"?"+q2:"")+location.hash); } /* o código secreto não fica no endereço (histórico, print, compartilhar) */
  const vq=(qs.get("v")||"").trim().toUpperCase(); if(/^[A-Z0-9]{2,14}$/.test(vq)) try{ localStorage.setItem("vend",JSON.stringify({cod:vq, t:Date.now(), n:1})); }catch(e){} /* convite do vendedor: o cliente fica ligado a ele, como no link do site */
  if(!ses && qs.get("criar")==="1"){ view="signup"; /* "Crie sua conta" no site, ou o convite da Búzios Lanchas com e-mail, nome e WhatsApp */
    if(qs.get("email")) typedEmail=qs.get("email");
    if((qs.get("nome")||qs.get("tel")) && !store.get("cli-draft")) store.set("cli-draft",{nome:qs.get("nome")||"", whatsapp:qs.get("tel")||""}); }
  if(ses){ view="main"; boot(); } else show();
})();

/* calendário próprio: todo <input type="date"> do app vira um botão que abre um calendário moderno (o input fica escondido e continua guardando o valor e disparando input/change) */
(function(){
  const VD=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value");
  const p2=n=>String(n).padStart(2,"0"), ISO=(y,m,d)=>`${y}-${p2(m)}-${p2(d)}`;
  const today=()=>{ const d=new Date(); return ISO(d.getFullYear(),d.getMonth()+1,d.getDate()); };
  const loc=()=>{ try{ return t("locale"); }catch(e){ return "pt-BR"; } };
  const tx=k=>{ try{ return t(k); }catch(e){ return ""; } };
  const ICO='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const label=v=>{ if(!v) return tx("dpPick"); const [y,m,d]=v.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short",year:"numeric"}).replace(/\./g,""); };
  function open(inp){
    const min=inp.min||"1900-01-01", max=inp.max||"2100-12-31", sel=VD.get.call(inp), td=today();
    let cur=(sel||(td<min?min:td>max?max:td)).slice(0,7);
    const ov=document.createElement("div"); ov.className="dpov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
    const box=document.createElement("div"); box.className="dpbox"; ov.appendChild(box);
    const close=()=>{ ov.remove(); document.removeEventListener("keydown",esc_); inp.__dpb&&inp.__dpb.focus(); };
    const esc_=e=>{ if(e.key==="Escape") close(); };
    const pick=v=>{ inp.value=v; inp.dispatchEvent(new Event("input",{bubbles:true})); inp.dispatchEvent(new Event("change",{bubbles:true})); close(); };
    const draw=()=>{
      const [y,m]=cur.split("-").map(Number), first=new Date(y,m-1,1), n=new Date(y,m,0).getDate(), L=loc();
      const wd=[...Array(7)].map((_,i)=>new Date(2023,0,1+i).toLocaleDateString(L,{weekday:"narrow"}));
      const yMin=+min.slice(0,4), yMax=+max.slice(0,4), years=[]; for(let k=yMax;k>=yMin;k--) years.push(k);
      const months=[...Array(12)].map((_,i)=>{ const a=ISO(y,i+1,1).slice(0,7); const ok=a>=min.slice(0,7)&&a<=max.slice(0,7); return `<option value="${i+1}"${i+1===m?" selected":""}${ok?"":" disabled"}>${new Date(2023,i,1).toLocaleDateString(L,{month:"long"}).replace(/^./,c=>c.toUpperCase())}</option>`; }).join("");
      const days=[...Array(n)].map((_,i)=>{ const d=ISO(y,m,i+1), dis=d<min||d>max; return `<button type="button" data-d="${d}"${dis?" disabled":""} class="${d===sel?"on":""}${d===td?" td":""}" aria-label="${new Date(y,m-1,i+1).toLocaleDateString(L,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}">${i+1}</button>`; }).join("");
      box.innerHTML=`<div class="dph"><button type="button" data-cm="-1"${cur>min.slice(0,7)?"":" disabled"} aria-label="‹">‹</button><div class="dpsel"><select data-m aria-label="mês">${months}</select><select data-y aria-label="ano">${years.map(k=>`<option${k===y?" selected":""}>${k}</option>`).join("")}</select></div><button type="button" data-cm="1"${cur<max.slice(0,7)?"":" disabled"} aria-label="›">›</button></div>
        <div class="dpg">${wd.map(w=>`<b>${w}</b>`).join("")}${"<i></i>".repeat(first.getDay())}${days}</div>
        <div class="dpf"><button type="button" data-x>${inp.required?"":tx("dpClear")}</button><span><button type="button" data-t${td<min||td>max?" disabled":""}>${tx("dpToday")}</button><button type="button" data-c>${tx("close")}</button></span></div>`;
      const go=(yy,mm)=>{ const d=new Date(yy,mm-1,1); let c=`${d.getFullYear()}-${p2(d.getMonth()+1)}`; if(c<min.slice(0,7)) c=min.slice(0,7); if(c>max.slice(0,7)) c=max.slice(0,7); cur=c; draw(); };
      box.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>go(y,m+(+b.dataset.cm)));
      box.querySelector("[data-m]").onchange=e=>go(y,+e.target.value);
      box.querySelector("[data-y]").onchange=e=>go(+e.target.value,m);
      box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>pick(b.dataset.d));
      const x=box.querySelector("[data-x]"); if(!x.textContent||!sel) x.style.visibility="hidden"; x.onclick=()=>pick("");
      box.querySelector("[data-t]").onclick=()=>pick(td);
      box.querySelector("[data-c]").onclick=close;
    };
    ov.onclick=e=>{ if(e.target===ov) close(); };
    document.addEventListener("keydown",esc_);
    draw(); document.body.appendChild(ov); (box.querySelector(".on")||box.querySelector(".td:not(:disabled)")||box.querySelector("[data-d]:not(:disabled)"))?.focus({preventScroll:true});
  }
  function enhance(inp){
    if(inp.__dpb) return;
    const b=document.createElement("button"); b.type="button"; b.className="dpb"+(inp.classList.contains("in")||inp.closest(".f")?"":" sm");
    const sync=()=>{ const v=VD.get.call(inp); b.classList.toggle("empty",!v); b.innerHTML=`${ICO}<span>${label(v)}</span>`; };
    Object.defineProperty(inp,"value",{configurable:true,get(){ return VD.get.call(this); },set(v){ VD.set.call(this,v); sync(); }});
    inp.__dpb=b; inp.classList.add("dp-src"); inp.tabIndex=-1; if(inp.id) b.setAttribute("aria-describedby",inp.id);
    b.onclick=()=>{ inp.classList.remove("miss"); open(inp); };
    inp.after(b); sync();
  }
  const scan=r=>{ if(r.querySelectorAll) r.querySelectorAll('input[type="date"]:not(.dp-src)').forEach(enhance); };
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1){ if(n.matches('input[type="date"]')) enhance(n); else scan(n); } }))).observe(document.documentElement,{childList:true,subtree:true});
  scan(document);
})();
</script>
<script>
// Botão de suporte (WhatsApp do Rodrigo) nas telas de entrar/cadastro e em todo o painel logado, menos para o admin
(()=>{ const a=document.createElement("a"); a.className="help"; a.id="help"; a.target="_blank"; a.rel="noopener"; a.hidden=true;
  /* logado (cliente, dono, marinheiro, vendedor): um botão só, "Suporte", com o número de mensagens novas; ao tocar escolhe Chat ou WhatsApp (Rodrigo 2026-10-25).
     Na tela de entrar continua só o WhatsApp. */
  const sup=document.createElement("button"); sup.type="button"; sup.className="help sup"; sup.hidden=true; sup.setAttribute("aria-expanded","false");
  const menu=document.createElement("div"); menu.className="supm"; menu.hidden=true;
  const ch=document.createElement("button"); ch.type="button"; ch.className="help supch";
  const box=document.createElement("div"); box.className="fabs"; menu.append(ch,a); box.append(menu,sup); document.body.appendChild(box);
  const SUP_ICON=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h2v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3v1h-6v2h6a2 2 0 0 0 2-2v-9a9 9 0 0 0-9-9z"/></svg>`;
  const close=()=>{ menu.hidden=true; sup.setAttribute("aria-expanded","false"); };
  const chatOk=()=>Array.isArray(S.convs) && (S.isClient || S.convs.length>0);
  let was="";
  const paint=()=>{ const auth=!!app.querySelector(".login"), on=!auth && !top_.hidden && !S.admin, n=+S.chatUnread||0, k=[on,auth,lang,n,chatOk(),menu.hidden].join("|");
    if(k===was) return; was=k;
    a.href=`https://wa.me/${WHATS}?text=${encodeURIComponent(t(auth?"waHelpLogin":"waHelp"))}`; a.setAttribute("aria-label",t("helpAria"));
    a.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${WA_PATH}"/></svg>${t("helpBtn")}`;
    if(auth){ box.dataset.auth="1"; sup.hidden=true; menu.hidden=false; ch.hidden=true; a.hidden=false; document.body.classList.add("has-help"); return; }
    if(box.dataset.auth){ delete box.dataset.auth; menu.hidden=true; sup.setAttribute("aria-expanded","false"); } a.hidden=false; sup.hidden=!on; document.body.classList.toggle("has-help",on); if(!on){ close(); return; }
    ch.hidden=!chatOk(); ch.innerHTML=`<span aria-hidden="true">💬</span>${t("chT")}${n?` <b class="unr">${n}</b>`:""}`;
    sup.innerHTML=`${SUP_ICON}${t("supBtn")}${n?`<b class="unr">${n}</b>`:""}`; sup.setAttribute("aria-label", t("supBtn")+(n?` (${n})`:""));
    if(!chatOk() && !menu.hidden) ch.hidden=true; };
  sup.onclick=()=>{ menu.hidden=!menu.hidden; sup.setAttribute("aria-expanded", String(!menu.hidden)); paint(); };
  a.addEventListener("click", ()=>{ if(!app.querySelector(".login")) close(); });
  ch.onclick=()=>{ close(); paint(); const L=S.convs||[], u=L.find(x=>+x.nao_lidas>0);
    if(u) return openChat(u.id); if(L.length===1) return openChat(L[0].id);
    if(!S.isClient){ const s=L.find(x=>x.tipo==="suporte"); return s ? openChat(s.id) : startChat("suporte"); } /* equipe: o botão leva ao suporte, não à conversa de um cliente */
    if(L.length){ const el=app.querySelector("[data-conv]"); if(el) return el.scrollIntoView({behavior:"smooth",block:"center"}); return openChat(L[0].id); }
    startChat("suporte"); };
  document.addEventListener("click", e=>{ if(!menu.hidden && !box.contains(e.target) && !app.querySelector(".login")){ close(); paint(); } });
  const sync=()=>{ was=""; paint(); };
  new MutationObserver(sync).observe(top_,{attributes:true,attributeFilter:["hidden"],childList:true}); new MutationObserver(sync).observe(app,{childList:true}); sync(); setInterval(paint, 2000); })();
</script>
