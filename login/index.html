let ses = store.get("dono-ses");
const saveSes = s => { ses = s ? {access_token:s.access_token, refresh_token:s.refresh_token,
  expires_at: s.expires_at || Math.floor(Date.now()/1000) + (+s.expires_in||3600), user:s.user || ses?.user} : null; store.set("dono-ses",ses); };
async function authCall(path, body, method="POST", token){
  const r = await fetch(SB+"/auth/v1/"+path, {method, headers:{apikey:KEY, "content-type":"application/json", ...(token?{authorization:"Bearer "+token}:{})}, body: body && JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.msg||j.error_description||j.message||r.status), {code:j.error_code||j.error||"", status:r.status});
  return j;
}
let refreshing = null;
async function fresh(force){
  if(!ses) throw new Error("sem sessão");
  if(!force && ses.expires_at - Date.now()/1000 > 60) return ses.access_token;
  refreshing ||= authCall("token?grant_type=refresh_token", {refresh_token:ses.refresh_token})
    .then(s=>{ saveSes(s); return ses.access_token; })
    .catch(e=>{ if(e.status>=400 && e.status<500){ saveSes(null); show(); } throw e; })
    .finally(()=>refreshing=null);
  return refreshing;
}
/* chamada ao banco já com o login; se a sessão venceu, renova e tenta mais uma vez */
async function db(path, {method="GET", body, prefer}={}, retry=true){
  const tok = await fresh();
  const r = await fetch(SB+"/rest/v1/"+path, {method, headers:{apikey:KEY, authorization:"Bearer "+tok, "content-type":"application/json", ...(prefer?{prefer}:{})}, body: body && JSON.stringify(body)});
  if(r.status===401 && retry){ await fresh(true); return db(path,{method,body,prefer},false); }
  const txt = await r.text(); const j = txt ? JSON.parse(txt) : null;
  if(!r.ok) throw Object.assign(new Error(j?.message||r.status), {status:r.status, code:j?.code});
  return j;
}

/* ===== agenda: busca os horários marcados do mês na tela e os próximos dias (com os dados do cliente) ===== */
let loadSeq = 0;
const noteCols = () => `anotacoes(origem,cliente,telefone,pessoas,valor,sinal,obs${S.marOk?",marinheiro,marinheiro_recusou":""})`;
const rowOf = r => ({id:r.id, lancha:r.lancha, data:r.data, horario:r.horario, nota:(Array.isArray(r.anotacoes)?r.anotacoes[0]:r.anotacoes)||null});
/* funcionário lê pela função do banco, que esconde os valores quando o dono não deixa ver */
async function fetchVis(de, ate, desc){
  const r = (await db("rpc/passeios_visualizador",{method:"POST", body:{l:S.cur, de:de||null, ate:ate||null}})).map(rowOf);
  return desc ? r.reverse() : r;
}
async function fetchRows(q){
  if(S.notes){ const withMar=S.marOk; try{ return (await db(`bloqueios?select=id,lancha,data,horario,${noteCols()}&${q}`)).map(rowOf); }
    catch(e){ if(e.status!==400 && e.status!==404) throw e;
      if(withMar){ S.marOk=false; return fetchRows(q); } /* coluna do marinheiro ainda não criada: segue sem ela */
      S.notes=false; } } /* tabela de anotações ainda não criada */
  return (await db(`bloqueios?select=id,lancha,data,horario&${q}`)).map(rowOf);
}
const SLOT_ORDER = {dia:0, manha:1, tarde:2, noite:3};
async function loadBlocks(){
  if(!S.cur) return mainView();
  if(S.tab==="lancha" && isRO()) S.tab="lista"; /* funcionário não tem a aba Lancha */
  if(S.tab==="lancha"){ if(S.cur==="*") S.cur=S.boats[0].slug; const my=++loadSeq, l=S.cur;
    db("rpc/lista_visualizadores",{method:"POST",body:{}}).then(v=>{ S.staff=v; }, ()=>{ S.staff=null; }).then(()=>{ if(my===loadSeq && S.tab==="lancha") mainView(); });
    try{ const r=await db(`itens?select=opcionais&lancha=eq.${encodeURIComponent(l)}`); if(my!==loadSeq) return; S.items = r[0]?.opcionais || []; S.err=""; }
    catch(e){ if(my!==loadSeq || !ses) return; S.items = (e.status===404||e.status===400) ? false : null; if(S.items===null) S.err="load"; }
    return mainView(); }
  const my=++loadSeq, y=S.month.getFullYear(), mo=S.month.getMonth();
  if(isRO() && !S.marNames[S.cur]){ const l=S.cur; S.marNames[l]={};
    db("rpc/marinheiros_da_lancha",{method:"POST",body:{l}}).then(v=>{ v.forEach(m=>S.marNames[l][m.user_id]=m.nome); }, ()=>{}); }
  const a=iso(new Date(y,mo,1)), b=iso(new Date(y,mo+1,0)), all=S.cur==="*", lf = all ? "" : `lancha=eq.${encodeURIComponent(S.cur)}&`;
  try{
    const ro = isRO(), yest = iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1)), p0 = iso(new Date(now.getFullYear(),now.getMonth()-3,1));
    const [rows, up, past] = ro ? await Promise.all([fetchVis(a,b), fetchVis(todayISO()), S.past ? fetchVis(p0,yest,true) : null]) : await Promise.all([
      all ? [] : fetchRows(`${lf}data=gte.${a}&data=lte.${b}`),
      fetchRows(`${lf}data=gte.${todayISO()}&order=data.asc&limit=200`),
      S.past ? fetchRows(`${lf}data=lt.${todayISO()}&data=gte.${iso(new Date(now.getFullYear(),now.getMonth()-3,1))}&order=data.desc&limit=200`) : null]);
    if(S.past) S.past = past;
    if(my!==loadSeq) return;
    S.blocks = new Map(); rows.forEach(r=>{ if(!S.blocks.has(r.data)) S.blocks.set(r.data,new Map()); S.blocks.get(r.data).set(r.horario,r); });
    S.upcoming = up.sort((x,z)=>x.data<z.data?-1:x.data>z.data?1:SLOT_ORDER[x.horario]-SLOT_ORDER[z.horario]); S.err="";
  }catch(e){ if(my!==loadSeq || !ses) return; S.err="load"; }
  mainView();
}

/* WhatsApp do cliente: código do país + número. Gravado como "+55 (21) 98888-7777"; números antigos sem "+" são do Brasil */
const COUNTRIES = ["BR:55","AR:54","UY:598","CL:56","PY:595","CO:57","PE:51","MX:52","US:1","PT:351","ES:34","FR:33","IT:39","DE:49","GB:44","NL:31","CH:41","BE:32","IL:972","AU:61"].map(x=>x.split(":"));
const flag = cc => cc.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0)));
function countryOpts(sel){
  let dn; try{ dn=new Intl.DisplayNames([t("locale")],{type:"region"}); }catch(e){}
  const known = COUNTRIES.some(c=>c[1]===sel);
  return COUNTRIES.map(([r,c])=>`<option value="${c}"${c===sel?" selected":""}>${flag(r)} ${dn?dn.of(r):r} +${c}</option>`).join("") + (known?"":`<option value="${esc(sel)}" selected>+${esc(sel)}</option>`);
}
function splitPhone(v){
  v=String(v||"").trim(); if(!v) return {cc:"55", num:""};
  const m=/^\+(\d{1,4})\s+(.*)$/.exec(v); if(m) return {cc:m[1], num:m[2]};
  if(v.startsWith("+")){ const d=v.replace(/\D/g,""), c=COUNTRIES.map(x=>x[1]).sort((a,b)=>b.length-a.length).find(c=>d.startsWith(c)); return c ? {cc:c, num:d.slice(c.length)} : {cc:d.slice(0,2), num:d.slice(2)}; }
  return {cc:"55", num:v};
}
function fmtBR(v){ const d=v.replace(/\D/g,"").slice(0,11); if(d.length<3) return d.length?`(${d}`:""; const a=d.slice(0,2), b=d.slice(2);
  return `(${a}) ` + (b.length>(d.length===11?5:4) ? b.slice(0,d.length===11?5:4)+"-"+b.slice(d.length===11?5:4) : b); }

/* WhatsApp válido: Brasil = DDD (11 a 99) + 8 dígitos (fixo, 2 a 5) ou 9 + 8 dígitos (celular); outros países = 6 a 15 dígitos no total */
function okPhone(cc, d){
  if(cc==="55") return /^[1-9][1-9](?:9\d{8}|[2-5]\d{7})$/.test(d);
  return d.length>=6 && (cc+d).length<=15;
}
const REQ = `<b class="req" aria-hidden="true">*</b>`;
function renderTrip(){
  if(tripRow && isRO(tripRow.lancha)) return renderTripRO();
  const r=tripRow, n=r?.nota||{}, f=(k,type,extra="")=>`<label class="f"><span>${t(k==="cliente"?"client":k==="telefone"?"phone":k==="pessoas"?"people":k==="valor"?"value":k==="sinal"?"deposit":"obs")}${k==="obs"?"":REQ}</span>${
    type==="area"?`<textarea id="n-${k}" rows="2" placeholder="${t("ph_obs")}">${esc(n[k]??"")}</textarea>`
    :`<input type="${type}" id="n-${k}" ${extra} placeholder="${t("ph_"+({cliente:"client",telefone:"phone",pessoas:"people",valor:"value",sinal:"deposit"}[k]))}" value="${esc(n[k]??"")}">`}</label>`;
  const ph=splitPhone(n.telefone), waNum = ph.num.replace(/\D/g,"") ? ph.cc+ph.num.replace(/\D/g,"") : "";
  const boatCap = () => CAPACITY[nboat] || 16;
  const peopleOpts = () => `<option value="">—</option>${Array.from({length:Math.max(boatCap(), +n.pessoas||0)},(_,i)=>`<option${+n.pessoas===i+1?" selected":""}>${i+1}</option>`).join("")}`;
  const fromDay = !!sheetDay;
  /* marinheiro do passeio: já vem o fixo da lancha; o dono troca só naquela data */
  let busy = [], pick = n.marinheiro || null;
  const isBusy = uid => nslot && busy.some(b=>b.user_id===uid && b.bloqueio_id!==r?.id && choca(b.horario,nslot));
  const marField = () => { if(!S.marOk || !S.sailors) return ""; const own=sailorsOf(nboat), fr=(S.free||[]).filter(f=>!own.some(m=>m.user_id===f.user_id));
    if(!own.length && !fr.length) return `<p class="muted" style="margin:0 0 12px;font-size:13px">⚓ ${t("sailorNoneYet")}</p>`;
    const keep = pick && !isBusy(pick) && [...own,...fr].some(m=>m.user_id===pick), fx=own.find(m=>m.fixo);
    const cur = keep ? pick : (!n.marinheiro_recusou && fx && !isBusy(fx.user_id) ? fx.user_id : "");
    const opt = m => `<option value="${m.user_id}"${m.user_id===cur?" selected":""}${isBusy(m.user_id)?" disabled":""}>${esc(m.nome)}${m.fixo?` (${t("fixo").toLowerCase()})`:""}${isBusy(m.user_id)?` · ${t("busy")}`:""}</option>`;
    return `<label class="f"><span>${t("sailorPick")}${S.admin?"":REQ}</span><select class="in" id="n-mar"><option value="">—</option>
      ${own.length?`<optgroup label="${esc(boatName(nboat))}">${own.map(opt).join("")}</optgroup>`:""}${fr.length?`<optgroup label="${t("freeGroup")}">${fr.map(opt).join("")}</optgroup>`:""}</select></label>
      ${n.marinheiro_recusou&&!n.marinheiro?`<p class="msg err" style="margin:-4px 0 12px;font-size:14px">⚠ ${t("refused",{name:esc(n.marinheiro_recusou)})}</p>`:""}
      ${fr.length?`<details class="frdet"><summary>${t("freeCallBtn")}</summary><p class="muted" style="margin:6px 0;font-size:13px">${t("freeCall")}</p>${freeWaList()}</details>`:""}`; };
  const refreshBusy = async () => { const box=document.getElementById("marbox"); if(!box || !S.free || !S.marOk) return;
    const sel=document.getElementById("n-mar"), keepV=sel?.value; busy = nd ? await db("rpc/marinheiros_ocupados",{method:"POST",body:{d:nd}}).catch(()=>[]) : [];
    if(keepV) pick = keepV; box.innerHTML = marField(); };
  let nd = tripNew ? (tripRow?.data||"") : r.data, nslot = tripNew ? "" : r.horario, nboat = tripNew ? (S.cur==="*" ? S.boats[0].slug : S.cur) : r.lancha;
  const slotBtns = () => `${[...SLOTS,...(nd&&hasNight(nd)?["noite"]:[])].map(k=>`<button type="button" role="radio" data-ns="${k}" aria-checked="${nslot===k}">${t("slot_"+k)}<small>${t("hours_"+k)}</small></button>`).join("")}`;
  sheet.innerHTML = `<div class="grab"></div><h2>${tripNew?t("tripNew"):t("tripEdit")}</h2>
    ${tripNew ? "" : `<p class="muted" style="margin-top:0">${fmtLong(r.data)} · ${t("slot_"+r.horario)}${S.boats.length>1?" · "+esc(boatName(r.lancha)):""}<br><small>${t("noteSub")}</small></p>`}
    <form id="nform" class="nform" novalidate><div id="nmsg"></div>
      ${tripNew ? `${S.cur==="*"?`<label class="f"><span>${t("boat")}</span><select class="in" id="n-boat">${S.boats.map(b=>`<option value="${b.slug}">${esc(b.nome)}</option>`).join("")}</select></label>`:""}
        <label class="f"><span>${t("dateL")}${REQ}</span><input type="date" id="n-date" min="${todayISO()}" value="${nd}"></label>
        <fieldset class="origin"><legend>${t("slotQ")}${REQ}</legend><div class="nslots" id="nslots">${slotBtns()}</div></fieldset>` : ""}
      ${S.notes ? `<fieldset class="origin"><legend>${t("closedBy")}${REQ}</legend><div>${["buzios","fora"].map(o=>`<button type="button" role="radio" data-o="${o}" aria-checked="${n.origem===o}">${t("o_"+o)}</button>`).join("")}</div></fieldset>
      ${f("cliente","text",'autocapitalize="words"')}
      <div class="f"><label for="n-telefone"><span>${t("phone")}${REQ}</span></label><div class="phone"><select class="in" id="n-ddi" aria-label="${t("country")}">${countryOpts(ph.cc)}</select><input type="tel" id="n-telefone" inputmode="tel" autocomplete="off" placeholder="${ph.cc==="55"?t("ph_phone"):""}" value="${esc(ph.num)}"></div></div>
      <label class="f"><span>${t("people")}${REQ} <small class="muted" style="font-weight:400">(${t("maxPeople",{n:boatCap()})})</small></span><select class="in" id="n-pessoas">${peopleOpts()}</select></label>
      <div id="marbox">${marField()}</div>
      <div class="row2">${f("valor","number",'inputmode="decimal" min="0" step="any"')}${f("sinal","number",'inputmode="decimal" min="0" step="any"')}</div>
      <p class="muted" id="vlock" style="margin:-4px 0 12px;font-size:13px" hidden>${t("valLocked")}</p>
      ${f("obs","area")}` : ""}
      ${waNum.length>=12?`<a class="btn sec" style="margin:0 0 10px" href="https://wa.me/${waNum}" target="_blank" rel="noopener">WhatsApp ${esc(n.cliente||"")}</a>`:""}
      <button class="btn" id="nsave">${t("save")}</button></form>
    <button type="button" class="btn sec" id="nback" style="margin-top:10px">${fromDay?t("back"):t("close")}</button>
    ${!tripNew && !fromDay ? `<button type="button" class="link danger" id="nfree">${t("freeSlot")}</button>` : ""}`;
  document.getElementById("nback").onclick=()=>{ if(fromDay){ noteFor=null; renderSheet(); } else closeDay(); };
  const fr=document.getElementById("nfree");
  if(fr) fr.onclick=async()=>{ if(!confirm(noteLine(n)?t("confirmFree"):t("freeSlot")+"?")) return;
    try{ await db(`bloqueios?id=eq.${r.id}`,{method:"DELETE"}); toast(t("freed")); closeDay(); loadBlocks(); }catch(e){ toast(t("saveErr")); } };
  let origem = n.origem || null;
  /* passeio da Búzios Lanchas: só o administrador define valor e sinal (o banco também trava) */
  const lockOrigin = !S.admin && n.origem==="buzios";
  const lockVals = () => { const on = !S.admin && origem==="buzios";
    ["valor","sinal"].forEach(k=>{ const el=document.getElementById("n-"+k); if(el){ el.disabled=on; if(on && !lockOrigin) el.value=""; } });
    const h=document.getElementById("vlock"); if(h) h.hidden=!on; };
  sheet.querySelectorAll("[data-o]").forEach(x=>{ if(lockOrigin) x.disabled=true; x.onclick=()=>{ origem = origem===x.dataset.o ? null : x.dataset.o;
    sheet.querySelectorAll("[data-o]").forEach(y=>y.setAttribute("aria-checked", y.dataset.o===origem)); lockVals(); }; });
  lockVals();
  const bindSlots=()=>sheet.querySelectorAll("[data-ns]").forEach(x=>x.onclick=()=>{ nslot=x.dataset.ns; sheet.querySelectorAll("[data-ns]").forEach(y=>y.setAttribute("aria-checked",y.dataset.ns===nslot)); const box=document.getElementById("marbox"); if(box){ const v=document.getElementById("n-mar")?.value; if(v) pick=v; box.innerHTML=marField(); } });
  bindSlots(); refreshBusy();
  const di=document.getElementById("n-date"); if(di) di.onchange=()=>{ nd=di.value; if(nslot==="noite"&&!hasNight(nd)) nslot=""; document.getElementById("nslots").innerHTML=slotBtns(); bindSlots(); refreshBusy(); };
  const bs=document.getElementById("n-boat"); if(bs) bs.onchange=()=>{ nboat=bs.value; const sp=document.getElementById("n-pessoas"), v=sp.value; sp.innerHTML=peopleOpts(); if(+v<=boatCap()) sp.value=v; sp.previousElementSibling.querySelector("small").textContent=`(${t("maxPeople",{n:boatCap()})})`; document.getElementById("marbox").innerHTML=marField(); };
  const ddi=document.getElementById("n-ddi"), tel=document.getElementById("n-telefone");
  if(ddi){ ddi.onchange=()=>{ tel.placeholder = ddi.value==="55" ? t("ph_phone") : ""; tel.value = ddi.value==="55" ? fmtBR(tel.value) : tel.value; };
    tel.oninput=()=>{ if(ddi.value==="55"){ const end=tel.selectionStart===tel.value.length; tel.value=fmtBR(tel.value); if(end) tel.selectionStart=tel.selectionEnd=tel.value.length; } }; }
  const nf=document.getElementById("nform");
  const unmiss=e=>{ const m=e.target.closest(".miss"); if(m) m.classList.remove("miss"); };
  nf.addEventListener("input",unmiss); nf.addEventListener("change",unmiss); nf.addEventListener("click",unmiss);
  nf.onsubmit = async e => { e.preventDefault();
    const out=document.getElementById("nmsg"), b=document.getElementById("nsave");
    const g=k=>document.getElementById("n-"+k)?.value.trim()||"", num=k=>{ const v=g(k).replace(",","."); return v===""?null:+v; };
    const nota={origem, cliente:g("cliente")||null, telefone:g("telefone").replace(/\D/g,"") ? `+${g("ddi")} ${g("telefone")}` : null, pessoas:num("pessoas"), valor:num("valor"), sinal:num("sinal"), obs:g("obs")||null};
    const marSel=document.getElementById("n-mar"); if(marSel) nota.marinheiro = marSel.value || null;
    const hasNote = Object.values(nota).some(v=>v!=null && v!=="");
    /* tudo obrigatório (menos observações); valor e sinal travados para o dono não contam */
    if(S.notes){
      const tel=g("telefone").replace(/\D/g,""), miss=[];
      if(tripNew && !nd) miss.push(document.getElementById("n-date"));
      if(tripNew && !nslot) miss.push(document.getElementById("nslots").closest("fieldset"));
      if(!origem) miss.push(sheet.querySelector("[data-o]").closest("fieldset"));
      if(!nota.cliente) miss.push(document.getElementById("n-cliente"));
      const telOk = okPhone(g("ddi"), tel); if(!telOk) miss.push(document.getElementById("n-telefone"));
      if(!nota.pessoas) miss.push(document.getElementById("n-pessoas"));
      if(marSel && !marSel.value && !S.admin) miss.push(marSel); /* o admin pode deixar sem marinheiro para remanejar */
      ["valor","sinal"].forEach(k=>{ const el=document.getElementById("n-"+k); if(!el.disabled && nota[k]==null) miss.push(el); });
      sheet.querySelectorAll(".miss").forEach(x=>x.classList.remove("miss"));
      if(miss.length){ miss.forEach(x=>x.classList.add("miss")); out.innerHTML=`<p class="msg err">${tel && !telOk ? (miss.length>1 ? t("needAll")+"<br>" : "")+t("phoneBad") : t("needAll")}</p>`;
        miss[0].scrollIntoView({block:"center",behavior:"smooth"}); if(!miss[0].matches("fieldset")) miss[0].focus({preventScroll:true}); return; }
    }
    b.disabled=true;
    let created = null;
    try{
      let row=r;
      if(tripNew){
        if(!nd || nd<todayISO() || !nslot){ out.innerHTML=`<p class="msg err">${t("needDateSlot")}</p>`; b.disabled=false; return; }
        /* não deixa marcar por cima: dia todo ocupa manhã e tarde; o noturno é separado */
        const ex = (await db(`bloqueios?select=horario&lancha=eq.${encodeURIComponent(nboat)}&data=eq.${nd}`)).map(x=>x.horario);
        const clash = nslot==="noite" ? ex.includes("noite") : nslot==="dia" ? ex.some(h=>h!=="noite") : ex.includes("dia")||ex.includes(nslot);
        if(clash){ out.innerHTML=`<p class="msg err">${t("slotTaken")}</p>`; b.disabled=false; return; }
        const got = await db("bloqueios?select=id,lancha,data,horario",{method:"POST", body:{lancha:nboat, data:nd, horario:nslot}, prefer:"return=representation"});
        row = rowOf(got[0]); created = row.id;
      }
      if(S.notes && (hasNote || row.nota)) await db("anotacoes",{method:"POST", body:{bloqueio_id:row.id, ...nota}, prefer:"resolution=merge-duplicates,return=minimal"});
      toast(tripNew ? t("tripSaved") : t("noteSaved"));
      if(fromDay){ row.nota=nota; noteFor=null; await loadBlocks(); renderSheet(); } else { closeDay(); loadBlocks(); }
    }catch(err){ b.disabled=false;
      if(created) await db(`bloqueios?id=eq.${created}`,{method:"DELETE"}).catch(()=>{}); /* não deixa horário marcado sem os dados */
      out.innerHTML=`<p class="msg err">${err.code==="23505"?t("slotTaken"):/marinheiro/i.test(err.message||"")?esc(err.message):t("saveErr")}</p>`; }
  };
}
async function toggle(d,k){
  const s=S.blocks.get(d)||new Map(), r=s.get(k), on=!!r, l=encodeURIComponent(S.cur);
  if(on && r.nota && noteLine(r.nota) && !confirm(t("confirmFree"))) return;
  renderSheet(k);
  try{
    if(on){ await db(`bloqueios?id=eq.${r.id}`,{method:"DELETE"}); s.delete(k); S.upcoming = S.upcoming.filter(x=>x.id!==r.id); }
    else{
      let got = await db("bloqueios?select=id,data,horario",{method:"POST", body:{lancha:S.cur, data:d, horario:k}, prefer:"resolution=ignore-duplicates,return=representation"});
      if(!got?.length) got = await db(`bloqueios?select=id,data,horario&lancha=eq.${l}&data=eq.${d}&horario=eq.${k}`); /* já estava marcado (outro aparelho) */
      const row=rowOf(got[0]); if(!S.blocks.has(d)) S.blocks.set(d,s); s.set(k,row);
      if(d>=todayISO()) S.upcoming = [...S.upcoming.filter(x=>x.id!==row.id), row].sort((x,z)=>x.data<z.data?-1:x.data>z.data?1:SLOT_ORDER[x.horario]-SLOT_ORDER[z.horario]);
    }
    toast(on?t("freed"):t("saved"));
  }catch(e){ toast(t("saveErr")); }
  const keep=sheetDay; mainView(); sheetDay=keep;
  if(sheetDay===d) renderSheet();
}

/* ===== início: confere o login, descobre as lanchas do dono e abre a agenda ===== */
async function boot(){
  app.innerHTML = `<p class="loading">…</p>`; S.notes = true;
  try{
    if(!ses.user) ses.user = await authCall("user",null,"GET",await fresh());
    saveSes(ses);
    const [admin, all, mine] = await Promise.all([db("rpc/e_admin",{method:"POST",body:{}}), db("lanchas?select=slug,nome&order=nome"), db(`donos?select=lancha&user_id=eq.${ses.user.id}`)]);
    S.admin = admin===true; S.all = all;
    /* funcionário: lanchas que só pode ver (tabela visualizadores); sem a tabela, segue sem eles */
    const vis = S.admin ? [] : await db(`visualizadores?select=lancha,ver_valores&user_id=eq.${ses.user.id}`).catch(()=>[]);
    S.ro = {}; vis.forEach(v=>{ if(!mine.some(m=>m.lancha===v.lancha)) S.ro[v.lancha]={valores:v.ver_valores}; });
    S.boats = S.admin ? all : all.filter(b=>mine.some(m=>m.lancha===b.slug) || S.ro[b.slug]);
    S.staff = [];
    /* marinheiros: o dono vê os da lancha dele; quem é marinheiro vê os passeios em que foi escalado. Sem as tabelas, segue sem eles */
    const owner = S.admin || mine.length>0;
    const [sl, fr, myT, sOf, meFree] = await Promise.all([
      owner ? db("rpc/lista_marinheiros",{method:"POST",body:{}}).catch(()=>null) : [],
      owner ? db("rpc/lista_freelancers",{method:"POST",body:{}}).catch(()=>null) : [],
      db("rpc/passeios_marinheiro",{method:"POST",body:{}}).catch(()=>null),
      db(`marinheiros?select=lancha,fixo&user_id=eq.${ses.user.id}`).catch(()=>[]),
      db(`freelancers?select=user_id&user_id=eq.${ses.user.id}`).catch(()=>[])]);
    S.sailors = sl; S.free = fr; S.myTrips = myT; S.sailorOf = sOf; S.isFree = meFree.length>0;
    if(S.admin) S.owners = await db("rpc/lista_donos",{method:"POST",body:{}});
    const saved = store.get("dono-boat");
    S.cur = S.boats.some(b=>b.slug===saved) || (saved==="*" && S.admin) ? saved : S.boats[0]?.slug || null;
    view = "main";
    await loadBlocks();
  }catch(e){
    if(!ses) return show();
    app.innerHTML = `<div class="card"><p class="msg err">${t("loadErr")}</p><button class="btn" id="retry">${t("retry")}</button></div>`;
    document.getElementById("retry").onclick = boot;
  }
}

/* links que chegam por e-mail (senha nova, confirmação) trazem o login no endereço */
(function(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get("error_description")){ loginErr=true; loginMsg=t("linkErr"); history.replaceState(null,"",location.pathname); return show(); }
  if(h.get("access_token")){
    saveSes({access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_at:+h.get("expires_at")||0, expires_in:h.get("expires_in"), user:null});
    history.replaceState(null,"",location.pathname);
    if(h.get("type")==="recovery"){ view="newpw"; return show(); }
  }
  if(ses){ view="main"; boot(); } else show();
})();
