<style>

h1{font-size:20px;margin:14px 0 6px}
p{color:var(--muted);margin:0 0 18px}
a.b{display:inline-block;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:999px}

</head>
<body>
<main><img src="/login/icon-192.png" alt=""><h1 id="t">Abrindo o WhatsApp…</h1><p id="s">Se não abrir sozinho, toque no botão.</p><a class="b" id="go" href="https://wa.me/5521999272550">WhatsApp</a></main>
<script>
const L={pt:["Abrindo o WhatsApp…","Se não abrir sozinho, toque no botão.","Olá! Recebi a mensagem da Búzios Lanchas sobre a minha consulta no site e quero continuar o atendimento."],
 en:["Opening WhatsApp…","If it doesn't open, tap the button.","Hi! I got the Búzios Lanchas message about my request on the website and I'd like to continue."],
 es:["Abriendo WhatsApp…","Si no se abre solo, toca el botón.","¡Hola! Recibí el mensaje de Búzios Lanchas sobre mi consulta en el sitio y quiero seguir con la atención."]};
const q=new URLSearchParams(location.search).get("l"), n=(navigator.language||"pt").slice(0,2).toLowerCase();
const l=L[q]?q:L[n]?n:"pt", x=L[l];
document.documentElement.lang=l==="pt"?"pt-BR":l;
document.getElementById("t").textContent=x[0]; document.getElementById("s").textContent=x[1];
const u="https://wa.me/5521999272550?text="+encodeURIComponent(x[2]);
document.getElementById("go").href=u; location.replace(u);
